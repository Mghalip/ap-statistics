const pages = ["\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003clink rel=\"icon\" href=\"data:,\">\n\u003ctitle>样本比例的抽样分布模拟器 · Sampling Distribution of p̂\u003c/title>\n\u003cscript>\ntry { if (window.self !== window.top) document.documentElement.classList.add('in-embed'); }\ncatch (e) { document.documentElement.classList.add('in-embed'); }\n\u003c/script>\n\u003cstyle>\n:root{\n  --ground:#F7F8FA; --surface:#FFFFFF; --surface-2:#F0F1F4; --line:#D6D8DA; --line-soft:#E8EAED;\n  --navy:#1865F2; --navy-2:#1152CC; --navy-soft:#EBF3FF;\n  --ink:#21242C; --ink-2:#525760; --ink-3:#6E737D;\n  --sage:#008A6E; --sage-soft:#E6F7F2;\n  --accent:#C75000; --accent-soft:#FFF3E8;\n  --gold:#B45309; --gold-soft:#FEF3C7; --gold-bright:#D97706;\n  --danger:#C5221F; --danger-soft:#FEECEB;\n  --serif:Georgia,\"Times New Roman\",\"Songti SC\",serif;\n  --sans:\"Lato\",-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"PingFang SC\",\"Hiragino Sans GB\",\"Segoe UI\",\"Microsoft YaHei\",sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;\n  --shadow-sm:0 1px 3px rgba(33,36,44,.06);\n  --r-md:8px; --r-sm:6px;\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}\nbutton,input,select{font:inherit;color:inherit}\nbutton,input[type=number],select{min-height:40px}\n:focus-visible{outline:2.5px solid var(--navy);outline-offset:2px;border-radius:var(--r-sm)}\n.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}\n\n/* Top standalone nav (hidden when embedded in viewer or offline wrapper) */\n.sim-nav{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 18px}\n.sim-nav-inner{max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.sim-nav a,.sim-nav strong{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}\n.sim-nav a.sim-back{color:var(--navy);border:1px solid var(--line);border-radius:6px;margin-right:6px;font-weight:700}\n.sim-nav a.sim-back:hover{background:var(--navy-soft);border-color:var(--navy);color:var(--navy)}\n.sim-nav a{color:var(--ink-2);border:1px solid transparent}\n.sim-nav a:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink)}\n.sim-nav strong{background:var(--navy);color:#fff;border:1px solid var(--navy)}\n.in-embed .sim-nav{display:none}\n\n.wrap{max-width:1160px;margin:0 auto;padding:18px 18px 40px}\nheader.top{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}\n.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}\n.kicker{font:700 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin:0 0 6px}\nh1{font:800 clamp(24px,3.6vw,34px)/1.18 var(--sans);margin:0;letter-spacing:-.02em}\nh1 em{font-style:normal;color:var(--navy)}\n.sub{margin:8px 0 0;color:var(--ink-2);font-size:15px;max-width:740px}\n\n.lang-switch{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;box-shadow:var(--shadow-sm);flex:none}\n.lang-switch button{min-height:30px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:700;cursor:pointer}\n.lang-switch button[aria-pressed=\"true\"]{background:var(--navy);color:#fff}\n\n.formula{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:stretch}\n.chip{background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:11px;font-family:var(--serif);font-size:14px;display:inline-flex;align-items:center;gap:7px;line-height:1.25;box-shadow:var(--shadow-sm)}\n.chip b 1.5px;color:var(--ink-3);margin-top:-2px}\n.pbar{display:flex;height:10px;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-top:8px;background:var(--surface-2)}\n.pbar .yes{background:var(--sage);transition:width .14s ease}\n.pbar-legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:3px}\n\n.n-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}\n.n-presets button{min-height:34px;padding:0 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ink-2)}\n.n-presets button:hover{border-color:var(--sage);color:var(--ink)}\n.n-presets button.active{background:var(--navy);color:#fff;border-color:var(--navy)}\n\n.theory{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 13px;font-size:13.5px}\n.theory div{display:flex;justify-content:space-between;padding:3px 0}\n.theory span:last-child{font-family:var(--mono);font-weight:700}\n\n.cond{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45;border:1px solid transparent}\n.cond.ok{background:var(--sage-soft);color:var(--sage);border-color:rgba(0,138,110,.28)}\n.cond.warn{background:var(--gold-soft);color:#92400E;border-color:rgba(180,83,9,.28)}\n.cond-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}\n.cchip{font:700 12px/1.2 var(--mono);padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid currentColor}\n\n.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}\n.actions button{border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;padding:8px 10px;font-size:13.5px}\n.actions button:hover{border-color:var(--navy)}\n.actions button:active{transform:translateY(1px)}\n.actions button.primary{background:var(--sage);color:#fff;border-color:var(--sage);grid-column:span 2;font-size:15px}\n.actions button.reset{color:var(--danger)}\n.actions button:disabled{opacity:.45;cursor:default;transform:none}\n\n.toggles{margin-top:12px;display:grid;gap:4px;font-size:13.5px}\n.toggles label{display:flex;align-items:center;gap:9px;padding:5px 2px;cursor:pointer}\n.toggles input{width:17px;height:17px;accent-color:var(--sage);cursor:pointer}\n.hint-note{font-size:12px;color:var(--ink-3);margin:8px 0 0}\n\n/* Main panel */\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}\n@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}\n.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-sm)}\n.stat .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}\n.stat .v{font-family:var(--mono);font-size:23px;font-weight:800;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums}\n.stat .s{font-size:12px;color:var(--ink-2);margin-top:2px}\n.stat.highlight{border-color:var(--sage);background:var(--sage-soft)}\n.stat.highlight .v{color:var(--sage)}\n\n.chart-card{padding:16px 16px 12px}\n.chart-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}\n.chart-head h2{margin:0}\n.legend{display:flex;gap:12px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}\n.legend span{display:inline-flex;align-items:center;gap:5px}\n.swatch{display:inline-block;width:12px;height:12px;border-radius:3px}\n.swatch-line{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--accent)}\n.swatch-dash{display:inline-block;width:16px;height:0;border-top:2px dashed var(--danger)}\ncanvas{width:100%;height:330px;display:block}\n@media(max-width:640px){canvas{height:270px}}\n.empty-note{text-align:center;color:var(--ink-2);font-size:13.5px;padding:10px 12px;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;margin-top:8px}\n\n/* Probability Explorer */\n.prob-card{margin-top:14px}\n.prob-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}\n.prob-input-wrap{display:flex;align-items:center;gap:8px}\n.prob-input-wrap label{font-size:13.5px;font-weight:700}\n.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}\n.seg button{min-height:32px;padding:0 12px;border:0;border-radius:999px;background:transparent;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:#fff}\n.prob-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}\n@media(max-width:640px){.prob-grid{grid-template-columns:1fr}}\n.pbox{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}\n.pbox .pk{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}\n.pbox .pv{font:800 20px/1.25 var(--mono);margin-top:3px;color:var(--ink)}\n.pbox .ps{font-size:12px;color:var(--ink-2);margin-top:2px}\n.prob-warn{margin-top:8px;font-size:12.5px;color:#92400E;background:var(--gold-soft);padding:6px 10px;border-radius:8px}\n\n.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}\n@media(max-width:860px){.sub-grid{grid-template-columns:1fr}}\n\ntable.check-tbl{width:100%;border-collapse:collapse;font-size:13.5px}\ntable.check-tbl th,table.check-tbl td{padding:7px 6px;border-bottom:1px solid var(--line-soft);text-align:right}\ntable.check-tbl th:first-child,table.check-tbl td:first-child{text-align:left}\ntable.check-tbl th{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}\ntable.check-tbl td.mono{font-family:var(--mono);font-weight:600}\ntable.check-tbl tr:last-child td{border-bottom:none}\n\n.dots{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}\n.sdot{width:13px;height:13px;border-radius:50%;border:1.8px solid transparent}\n.sdot.s{background:var(--sage)}\n.sdot.f{background:transparent;border-color:var(--ink-3);opacity:.55}\n.sample-meta{font-size:13.5px;color:var(--ink-2);margin:6px 0 0}\n\n.takeaways{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n@media(max-width:760px){.takeaways{grid-template-columns:1fr}}\n.take{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--sage);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow-sm)}\n.take b{display:block;margin-bottom:4px;font-size:14px}\n.take p{margin:0;font-size:13px;color:var(--ink-2)}\n\nfooter{margin-top:18px;font-size:12.5px;color:var(--ink-3);text-align:center}\n.kbd{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 6px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cnav class=\"sim-nav\" aria-label=\"选择模拟器\">\n  \u003cdiv class=\"sim-nav-inner\">\n    \u003ca class=\"sim-back\" href=\"../homework.html\">← 返回 AP 统计\u003c/a>\n    \u003cstrong aria-current=\"page\" data-i18n=\"nav_p\">样本比例 p̂\u003c/strong>\n    \u003ca href=\"proportion-difference.html\" data-i18n=\"nav_pd\">两样本比例差 p̂₁ − p̂₂\u003c/a>\n    \u003ca href=\"mean.html\" data-i18n=\"nav_m\">样本均值 x̄\u003c/a>\n    \u003ca href=\"mean-difference.html\" data-i18n=\"nav_md\">两样本均值差 x̄₁ − x̄₂\u003c/a>\n  \u003c/div>\n\u003c/nav>\n\n\u003cdiv class=\"wrap\">\n  \u003cheader class=\"top\">\n    \u003cdiv class=\"head-row\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">AP Statistics · Sampling Distribution\u003c/p>\n        \u003ch1 data-i18n-html=\"h1\">样本比例的抽样分布 \u003cem>p̂\u003c/em>\u003c/h1>\n        \u003cp class=\"sub\" data-i18n-html=\"sub\">设定总体比例 \u003cb>p\u003c/b> 与样本量 \u003cb>n\u003c/b>，反复随机抽样并计算样本比例 \u003cb>p̂\u003c/b>，观察中心、离散度与形状何时逼近正态分布。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"lang-switch\" role=\"group\" aria-label=\"Language toggle\">\n        \u003cbutton type=\"button\" id=\"langZh\" aria-pressed=\"true\">中文\u003c/button>\n        \u003cbutton type=\"button\" id=\"langEn\" aria-pressed=\"false\">EN\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula\">\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_def\">定义\u003c/span>\u003cspan class=\"eq\">\u003ci>p̂\u003c/i> = \u003cspan class=\"frac\">\u003cspan class=\"frac-num\">\u003ci>X\u003c/i>\u003c/span>\u003cspan class=\"frac-den\">\u003ci>n\u003c/i>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_mean\">均值\u003c/span>\u003cspan class=\"eq\">μ\u003csub>p̂\u003c/sub> = \u003ci>p\u003c/i>\u003c/span>\u003c/span>\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_sd\">标准差 (SE)\u003c/span>\u003cspan class=\"eq\">σ\u003csub>p̂\u003c/sub> = \u003cmath>\u003cmsqrt>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmi>n\u003c/mi>\u003c/mfrac>\u003c/msqrt>\u003c/math>\u003c/span>\u003c/span>\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_cond\">大样本条件\u003c/span>\u003cspan class=\"eq\">\u003ci>np\u003c/i> ≥ 10 &amp; \u003ci>n\u003c/i>(1−\u003ci>p\u003c/i>) ≥ 10\u003c/span>\u003c/span>\n    \u003c/div>\n\n    \u003cdetails class=\"guide-box\">\n      \u003csummary data-i18n=\"guide_title\">课堂练习引导（Worksheet Guide）\u003c/summary>\n      \u003cp data-i18n=\"guide_body\">第 1–2 页：用滑块或输入框选 n（含 25、160、400），每组抽 1,000 次，记录模拟均值和 SD。判断形状时可先取消勾选「显示理论正态曲线」，观察直方图本身是否对称。\u003c/p>\n    \u003c/details>\n  \u003c/header>\n\n  \u003cdiv class=\"layout\">\n    \u003csection class=\"card\" aria-label=\"参数设置\">\n      \u003ch2 data-i18n=\"sec_ctrl\">总体与样本参数\u003c/h2>\n\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\n          \u003clabel for=\"pRange\" data-i18n=\"lbl_p\">总体比例 p\u003c/label>\n          \u003cinput type=\"number\" class=\"num-input\" id=\"pNum\" min=\"0.02\" max=\"0.98\" step=\"0.01\" value=\"0.50\" aria-label=\"总体比例 p 数值\">\n        \u003c/div>\n        \u003cinput type=\"range\" id=\"pRange\" min=\"0.02\" max=\"0.98\" step=\"0.01\" value=\"0.50\">\n        \u003cdiv class=\"ticks\">\u003cspan>0\u003c/span>\u003cspan>0.25\u003c/span>\u003cspan>0.50\u003c/span>\u003cspan>0.75\u003c/span>\u003cspan>1\u003c/span>\u003c/div>\n        \u003cdiv class=\"pbar\" aria-hidden=\"true\">\u003cdiv class=\"yes\" id=\"pbar\" style=\"width:50%\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"pbar-legend\">\u003cspan data-i18n=\"lbl_succ\">成功 success\u003c/span>\u003cspan data-i18n=\"lbl_fail\">失败 failure\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\n          \u003clabel for=\"nRange\" data-i18n=\"lbl_n\">样本量 n\u003c/label>\n          \u003cinput type=\"number\" class=\"num-input\" id=\"nNum\" min=\"5\" max=\"1000\" step=\"1\" value=\"25\" aria-label=\"样本量 n 数值\">\n        \u003c/div>\n        \u003cinput type=\"range\" id=\"nRange\" min=\"5\" max=\"500\" step=\"5\" value=\"25\">\n        \u003cdiv class=\"n-presets\" id=\"nPresets\">\n          \u003cbutton type=\"button\" data-n=\"10\">10\u003c/button>\n          \u003cbutton type=\"button\" data-n=\"25\" class=\"active\">25\u003c/button>\n          \u003cbutton type=\"button\" data-n=\"50\">50\u003c/button>\n          \u003cbutton type=\"button\" data-n=\"100\">100\u003c/button>\n          \u003cbutton type=\"button\" data-n=\"160\">160\u003c/button>\n          \u003cbutton type=\"button\" data-n=\"400\">400\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"theory\">\n        \u003cdiv>\u003cspan data-i18n=\"th_mean\">理论均值 μ\u003csub>p̂\u003c/sub>\u003c/span>\u003cspan id=\"thMean\">0.500\u003c/span>\u003c/div>\n        \u003cdiv>\u003cspan data-i18n=\"th_sd\">理论标准差 σ\u003csub>p̂\u003c/sub>\u003c/span>\u003cspan id=\"thSD\">0.100\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"cond ok\" id=\"condBox\">\n        \u003cdiv class=\"cond-chips\" id=\"condChips\">\u003c/div>\n        \u003cdiv id=\"condText\">\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"actions\">\n        \u003cbutton type=\"button\" class=\"primary\" id=\"btn1\" data-i18n=\"btn_1\">抽 1 次样本\u003c/button>\n        \u003cbutton type=\"button\" id=\"btn10\">+ 10\u003c/button>\n        \u003cbutton type=\"button\" id=\"btn100\">+ 100\u003c/button>\n        \u003cbutton type=\"button\" id=\"btn1000\">+ 1,000\u003c/button>\n        \u003cbutton type=\"button\" class=\"reset\" id=\"btnReset\" data-i18n=\"btn_reset\">Reset 清空\u003c/button>\n        \u003cbutton type=\"button\" id=\"btnCsv\" style=\"grid-column:span 2\" disabled data-i18n=\"btn_csv\">导出 CSV\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"toggles\">\n        \u003clabel>\u003cinput type=\"checkbox\" id=\"chkCurve\" checked>\u003cspan data-i18n=\"tog_curve\">显示理论正态曲线 N(p, σ\u003csub>p̂\u003c/sub>)\u003c/span>\u003c/label>\n        \u003clabel>\u003cinput type=\"checkbox\" id=\"chkMean\" checked>\u003cspan data-i18n=\"tog_mean\">显示模拟均值线\u003c/span>\u003c/label>\n      \u003c/div>\n      \u003cp class=\"hint-note\" data-i18n=\"hint_clear\">修改 p 或 n 会清空直方图，因为抽样分布已改变。按 Space 可抽 1 次。\u003c/p>\n    \u003c/section>\n\n    \u003cdiv>\n      \u003cdiv class=\"stats\">\n        \u003cdiv class=\"stat\">\u003cdiv class=\"k\" data-i18n=\"st_cnt\">抽样次数\u003c/div>\u003cdiv class=\"v\" id=\"stCount\">0\u003c/div>\u003cdiv class=\"s\" data-i18n=\"st_cnt_s\">replications\u003c/div>\u003c/div>\n        \u003cdiv class=\"stat highlight\">\u003cdiv class=\"k\" data-i18n=\"st_mean\">模拟均值 p̂̄\u003c/div>\u003cdiv class=\"v\" id=\"stMean\">—\u003c/div>\u003cdiv class=\"s\" id=\"stMeanSub\">theory: 0.500\u003c/div>\u003c/div>\n        \u003cdiv class=\"stat highlight\">\u003cdiv class=\"k\" data-i18n=\"st_sd\">模拟标准差 SD\u003c/div>\u003cdiv class=\"v\" id=\"stSD\">—\u003c/div>\u003cdiv class=\"s\" id=\"stSDSub\">theory: 0.100\u003c/div>\u003c/div>\n        \u003cdiv class=\"stat\">\u003cdiv class=\"k\" data-i18n=\"st_last\">最近一次 p̂\u003c/div>\u003cdiv class=\"v\" id=\"stLast\">—\u003c/div>\u003cdiv class=\"s\" id=\"stLastSub\">—\u003c/div>\u003c/div>\n      \u003c/div>\n\n      \u003csection class=\"card chart-card\">\n        \u003cdiv class=\"chart-head\">\n          \u003ch2 data-i18n=\"chart_title\">样本比例 p̂ 直方图（离散刻度对齐）\u003c/h2>\n          \u003cdiv class=\"legend\">\n            \u003cspan>\u003ci class=\"swatch\" style=\"background:var(--sage)\">\u003c/i>\u003cspan data-i18n=\"leg_bar\">模拟 p̂\u003c/span>\u003c/span>\n            \u003cspan>\u003ci class=\"swatch\" style=\"background:var(--accent)\">\u003c/i>\u003cspan data-i18n=\"leg_tail\">尾部高亮\u003c/span>\u003c/span>\n            \u003cspan>\u003ci class=\"swatch-line\">\u003c/i>\u003cspan data-i18n=\"leg_curve\">理论正态曲线\u003c/span>\u003c/span>\n            \u003cspan>\u003ci class=\"swatch-dash\">\u003c/i>\u003cspan data-i18n=\"leg_mean\">模拟均值\u003c/span>\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003ccanvas id=\"chart\" width=\"880\" height=\"330\">\u003c/canvas>\n        \u003cdiv class=\"empty-note\" id=\"emptyNote\">\u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"card prob-card\" aria-label=\"概率探索器\">\n        \u003cdiv class=\"prob-controls\">\n          \u003ch2 style=\"margin:0\" data-i18n=\"prob_title\">概率探索器与尾部高亮\u003c/h2>\n          \u003cdiv class=\"prob-input-wrap\">\n            \u003clabel for=\"cutoff\" data-i18n=\"prob_cut\">临界值 c\u003c/label>\n            \u003cinput type=\"number\" class=\"num-input\" id=\"cutoff\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.65\">\n          \u003c/div>\n          \u003cdiv class=\"seg\" role=\"group\" aria-label=\"尾部高亮模式\">\n            \u003cbutton type=\"button\" data-tail=\"none\" aria-pressed=\"true\" data-i18n=\"tail_none\">无高亮\u003c/button>\n            \u003cbutton type=\"button\" data-tail=\"gt\" aria-pressed=\"false\">&gt; c\u003c/button>\n            \u003cbutton type=\"button\" data-tail=\"lt\" aria-pressed=\"false\">&lt; c\u003c/button>\n            \u003cbutton type=\"button\" data-tail=\"two\" aria-pressed=\"false\" data-i18n=\"tail_two\">双尾\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"prob-grid\">\n          \u003cdiv class=\"pbox\">\n            \u003cdiv class=\"pk\" id=\"pEmpLbl\">P(p̂ &gt; 0.65)\u003c/div>\n            \u003cdiv class=\"pv\" id=\"pEmpVal\">—\u003c/div>\n            \u003cdiv class=\"ps\" id=\"pEmpSub\">—\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"pbox\">\n            \u003cdiv class=\"pk\" data-i18n=\"prob_model\">理论正态近似\u003c/div>\n            \u003cdiv class=\"pv\" id=\"pTheoVal\">—\u003c/div>\n            \u003cdiv class=\"ps\" id=\"pTheoSub\">—\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"pbox\">\n            \u003cdiv class=\"pk\" data-i18n=\"prob_z\">标准化 z-score\u003c/div>\n            \u003cdiv class=\"pv\" id=\"pZVal\">—\u003c/div>\n            \u003cdiv class=\"ps\">z = (c − p) / σ\u003csub>p̂\u003c/sub>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"prob-warn\" id=\"probWarn\" hidden data-i18n=\"prob_warn\">⚠ 当前未满足 Large Counts 条件，理论正态概率仅供参考，请以模拟直方图为准。\u003c/div>\n      \u003c/section>\n\n      \u003cdiv class=\"sub-grid\">\n        \u003csection class=\"card\" id=\"sampleCard\">\n          \u003ch2 data-i18n=\"sec_last\">最近一次样本（单次样本 ≠ 抽样分布）\u003c/h2>\n          \u003cdiv class=\"dots\" id=\"dots\">\u003c/div>\n          \u003cp class=\"sample-meta\" id=\"sampleMeta\">\u003c/p>\n        \u003c/section>\n\n        \u003csection class=\"card\">\n          \u003ch2 data-i18n=\"sec_check\">理论 vs 模拟检验\u003c/h2>\n          \u003ctable class=\"check-tbl\">\n            \u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth data-i18n=\"tbl_th\">理论值\u003c/th>\u003cth data-i18n=\"tbl_sim\">模拟值\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd data-i18n=\"row_mean\">中心（均值）\u003c/td>\u003ctd class=\"mono\" id=\"tMean\">—\u003c/td>\u003ctd class=\"mono\" id=\"sMean\">—\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd data-i18n=\"row_sd\">离散度（SD）\u003c/td>\u003ctd class=\"mono\" id=\"tSD\">—\u003c/td>\u003ctd class=\"mono\" id=\"sSD\">—\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>±1σ\u003csub>p̂\u003c/sub>\u003c/td>\u003ctd class=\"mono\">≈ 68%\u003c/td>\u003ctd class=\"mono\" id=\"sW1\">—\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>±2σ\u003csub>p̂\u003c/sub>\u003c/td>\u003ctd class=\"mono\">≈ 95%\u003c/td>\u003ctd class=\"mono\" id=\"sW2\">—\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>±3σ\u003csub>p̂\u003c/sub>\u003c/td>\u003ctd class=\"mono\">≈ 99.7%\u003c/td>\u003ctd class=\"mono\" id=\"sW3\">—\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd data-i18n=\"row_skew\">偏度 skewness\u003c/td>\u003ctd class=\"mono\">0\u003c/td>\u003ctd class=\"mono\" id=\"sSkew\">—\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/section>\n      \u003c/div>\n\n      \u003cdiv class=\"takeaways\">\n        \u003cdiv class=\"take\">\u003cb data-i18n=\"tk1_t\">中心 — 无偏估计\u003c/b>\u003cp data-i18n=\"tk1_b\">无论 n 多小，p̂ 的平均值都会稳定在总体比例 p 附近，不会系统性偏高或偏低。\u003c/p>\u003c/div>\n        \u003cdiv class=\"take\">\u003cb data-i18n=\"tk2_t\">离散度 — n 翻 4 倍，SD 减半\u003c/b>\u003cp data-i18n=\"tk2_b\">由 √[p(1−p)/n] 可知，样本量放大 4 倍（例如 25 → 100 或 100 → 400），标准误才缩小一半。\u003c/p>\u003c/div>\n        \u003cdiv class=\"take\">\u003cb data-i18n=\"tk3_t\">形状 — 离散到正态\u003c/b>\u003cp data-i18n=\"tk3_b\">当 np 和 n(1−p) 均 ≥ 10 时，离散的二项柱状分布逐渐变得平滑对称，可用正态分布近似。\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cfooter>\n    \u003cspan data-i18n=\"foot\">所有抽样均在浏览器本地完成；按\u003c/span> \u003cspan class=\"kbd\">Space\u003c/span> \u003cspan data-i18n=\"foot2\">快速抽 1 次。\u003c/span>\n  \u003c/footer>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n  var $ = function(id){ return document.getElementById(id); };\n  var state = { p:0.50, n:25, reps:[], last:null, tail:\"none\", lang:\"zh\", cutoffTouched:false };\n\n  var I18N = {\n    zh:{\n      nav_p:\"样本比例 p̂\", nav_pd:\"两样本比例差 p̂₁ − p̂₂\", nav_m:\"样本均值 x̄\", nav_md:\"两样本均值差 x̄₁ − x̄₂\",\n      h1:\"样本比例的抽样分布 \u003cem>p̂\u003c/em>\",\n      sub:\"设定总体比例 \u003cb>p\u003c/b> 与样本量 \u003cb>n\u003c/b>，反复随机抽样并计算样本比例 \u003cb>p̂\u003c/b>，观察中心、离散度与形状何时逼近正态分布。\",\n      f_def:\"定义\", f_mean:\"均值\", f_sd:\"标准差 (SE)\", f_cond:\"大样本条件\",\n      guide_title:\"课堂练习引导（Worksheet Guide）\",\n      guide_body:\"第 1–2 页：用滑块或输入框选 n（含 25、160、400），每组抽 1,000 次，记录模拟均值和 SD。判断形状时可先取消勾选「显示理论正态曲线」，观察直方图本身是否对称。\",\n      sec_ctrl:\"总体与样本参数\", lbl_p:\"总体比例 p\", lbl_n:\"样本量 n\", lbl_succ:\"成功 success\", lbl_fail:\"失败 failure\",\n      th_mean:\"理论均值 μ\u003csub>p̂\u003c/sub>\", th_sd:\"理论标准差 σ\u003csub>p̂\u003c/sub>\",\n      btn_1:\"抽 1 次样本\", btn_reset:\"Reset 清空\", btn_csv:\"导出 CSV\",\n      tog_curve:\"显示理论正态曲线 N(p, σ\u003csub>p̂\u003c/sub>)\", tog_mean:\"显示模拟均值线\",\n      hint_clear:\"修改 p 或 n 会清空直方图，因为抽样分布已改变。按 Space 可抽 1 次。\",\n      st_cnt:\"抽样次数\", st_cnt_s:\"次重复抽样\", st_mean:\"模拟均值\", st_sd:\"模拟标准差 SD\", st_last:\"最近一次 p̂\",\n      chart_title:\"样本比例 p̂ 直方图（离散刻度对齐）\", leg_bar:\"模拟 p̂\", leg_tail:\"尾部高亮\", leg_curve:\"理论正态曲线\", leg_mean:\"模拟均值\",\n      prob_title:\"概率探索器与尾部高亮\", prob_cut:\"临界值 c\", tail_none:\"无高亮\", tail_two:\"双尾\",\n      prob_model:\"理论正态近似\", prob_z:\"标准化 z-score\",\n      prob_warn:\"⚠ 当前未满足 Large Counts 条件，理论正态概率仅供参考，请以模拟直方图为准。\",\n      sec_last:\"最近一次样本（单次样本 ≠ 抽样分布）\", sec_check:\"理论 vs 模拟检验\",\n      tbl_th:\"理论值\", tbl_sim:\"模拟值\", row_mean:\"中心（均值）\", row_sd:\"离散度（SD）\", row_skew:\"偏度 skewness\",\n      tk1_t:\"中心 — 无偏估计\", tk1_b:\"无论 n 多小，p̂ 的平均值都会稳定在总体比例 p 附近，不会系统性偏高或偏低。\",\n      tk2_t:\"离散度 — n 翻 4 倍，SD 减半\", tk2_b:\"由 √[p(1−p)/n] 可知，样本量放大 4 倍（例如 25 → 100 或 100 → 400），标准误才缩小一半。\",\n      tk3_t:\"形状 — 离散到正态\", tk3_b:\"当 np 和 n(1−p) 均 ≥ 10 时，离散的二项柱状分布逐渐变得平滑对称，可用正态分布近似。\",\n      foot:\"所有抽样均在浏览器本地完成；按\", foot2:\"快速抽 1 次。\",\n      empty:\"尚未抽样 — 点击「抽 1 次样本」抽取第一个容量为 n = {n} 的样本。\",\n      last_empty:\"尚未抽样。每次会从总体抽取 n 个个体并统计成功比例。\",\n      cond_ok:\"✓ 满足 Large Counts 条件（np ≥ 10 且 n(1−p) ≥ 10），p̂ 抽样分布近似正态。\",\n      cond_warn:\"⚠ 未满足 Large Counts 条件：直方图将呈离散或偏态，正态曲线仅作参考。\",\n      theory_pre:\"理论: \", succ_of:\"{x} / {n} 成功\",\n      last_meta:\"实心 = 成功，空心 = 失败。成功 {x} / {n} → p̂ = {phat}（总体 p = {p}）\"\n    },\n    en:{\n      nav_p:\"Sample Proportion p̂\", nav_pd:\"Diff of Proportions p̂₁ − p̂₂\", nav_m:\"Sample Mean x̄\", nav_md:\"Diff of Means x̄₁ − x̄₂\",\n      h1:\"Sampling Distribution of \u003cem>p̂\u003c/em>\",\n      sub:\"Set a true population proportion \u003cb>p\u003c/b> and sample size \u003cb>n\u003c/b>. Draw random samples to see how the center, spread, and shape of \u003cb>p̂\u003c/b> behave.\",\n      f_def:\"Definition\", f_mean:\"Mean\", f_sd:\"SD (SE)\", f_cond:\"Large Counts\",\n      guide_title:\"Classroom Worksheet Guide\",\n      guide_body:\"Pages 1–2: Use the slider or input box for n (including 25, 160, 400), take 1,000 samples per setting, and record the simulated mean & SD. Uncheck the Normal curve first when judging shape.\",\n      sec_ctrl:\"Population & Sample\", lbl_p:\"True proportion p\", lbl_n:\"Sample size n\", lbl_succ:\"success\", lbl_fail:\"failure\",\n      th_mean:\"Theoretical mean μ\u003csub>p̂\u003c/sub>\", th_sd:\"Theoretical SD σ\u003csub>p̂\u003c/sub>\",\n      btn_1:\"Take 1 Sample\", btn_reset:\"Reset\", btn_csv:\"Download CSV\",\n      tog_curve:\"Show Normal curve N(p, σ\u003csub>p̂\u003c/sub>)\", tog_mean:\"Show simulated mean line\",\n      hint_clear:\"Changing p or n clears the histogram for the new sampling distribution. Press Space to draw 1.\",\n      st_cnt:\"Samples taken\", st_cnt_s:\"replications\", st_mean:\"Mean of p̂\", st_sd:\"SD of p̂\", st_last:\"Last p̂\",\n      chart_title:\"Histogram of Sample Proportions p̂ (Discrete-Aligned)\", leg_bar:\"p̂ values\", leg_tail:\"Shaded tail\", leg_curve:\"Normal curve\", leg_mean:\"Simulated mean\",\n      prob_title:\"Probability Explorer & Tail Shading\", prob_cut:\"Cutoff c\", tail_none:\"None\", tail_two:\"Two-tail\",\n      prob_model:\"Normal Model\", prob_z:\"z-score\",\n      prob_warn:\"⚠ Large Counts condition is not met; the Normal model approximation may be inaccurate.\",\n      sec_last:\"Most Recent Sample (One sample ≠ Sampling distribution)\", sec_check:\"Theory vs. Simulation\",\n      tbl_th:\"Theory\", tbl_sim:\"Simulated\", row_mean:\"Center (Mean)\", row_sd:\"Spread (SD)\", row_skew:\"Skewness\",\n      tk1_t:\"Center — Unbiased\", tk1_b:\"Regardless of n, the mean of p̂ values settles near the true population proportion p.\",\n      tk2_t:\"Spread — 4× n halves SD\", tk2_b:\"Because σ = √[p(1−p)/n], quadrupling n (e.g., 25 → 100 or 100 → 400) cuts the SE in half.\",\n      tk3_t:\"Shape — Discrete to Normal\", tk3_b:\"When both np ≥ 10 and n(1−p) ≥ 10, the discrete binomial histogram becomes smooth and bell-shaped.\",\n      foot:\"All simulations run locally in your browser; press\", foot2:\"to take 1 sample.\",\n      empty:\"No samples yet — click Take 1 Sample to draw your first sample of n = {n}.\",\n      last_empty:\"No draws yet. Each draw samples n individuals and computes the sample proportion.\",\n      cond_ok:\"✓ Large Counts met (np ≥ 10 and n(1−p) ≥ 10) — p̂ is approximately Normal.\",\n      cond_warn:\"⚠ Large Counts NOT met — expect discrete gaps or skew; Normal curve is only a rough guide.\",\n      theory_pre:\"theory: \", succ_of:\"{x} of {n} successes\",\n      last_meta:\"Filled = success, outline = failure. Successes: {x} / {n} → p̂ = {phat} (true p = {p})\"\n    }\n  };\n\n  function t(k){ return (I18N[state.lang] && I18N[state.lang][k]) || I18N.zh[k] || k; }\n  function clamp(v,lo,hi){ return Math.min(hi, Math.max(lo, v)); }\n  function fmt(x,d){ return (x===null||x===undefined||isNaN(x)) ? \"—\" : Number(x).toFixed(d===undefined?3:d); }\n  function theorySE(){ return Math.sqrt(state.p * (1 - state.p) / state.n); }\n  function arrMinMax(arr){\n    if(!arr.length) return [0, 0];\n    var mn = arr[0], mx = arr[0];\n    for(var i=1;i\u003carr.length;i++){ if(arr[i]\u003cmn) mn=arr[i]; if(arr[i]>mx) mx=arr[i]; }\n    return [mn, mx];\n  }\n  function normalPDF(x,mu,sd){ var z=(x-mu)/sd; return Math.exp(-0.5*z*z)/(sd*Math.sqrt(2*Math.PI)); }\n  function normalCDF(z){\n    var a=Math.abs(z), p=1/(1+0.2316419*a);\n    var poly=p*(0.319381530+p*(-0.356563782+p*(1.781477937+p*(-1.821255978+p*1.330274429))));\n    var c=1-Math.exp(-0.5*a*a)/Math.sqrt(2*Math.PI)*poly;\n    return z>=0 ? c : 1-c;\n  }\n  function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }\n\n  function applyLang(){\n    document.documentElement.lang = state.lang === \"zh\" ? \"zh-CN\" : \"en\";\n    $(\"langZh\").setAttribute(\"aria-pressed\", String(state.lang===\"zh\"));\n    $(\"langEn\").setAttribute(\"aria-pressed\", String(state.lang===\"en\"));\n    document.querySelectorAll(\"[data-i18n]\").forEach(function(el){ el.textContent = t(el.dataset.i18n); });\n    document.querySelectorAll(\"[data-i18n-html]\").forEach(function(el){ el.innerHTML = t(el.dataset.i18nHtml); });\n    syncAll();\n  }\n\n  function defaultCutoff(){\n    var c = clamp(state.p + 1.5 * theorySE(), 0.01, 0.99);\n    return Math.round(c * 100) / 100;\n  }\n\n  function syncTheory(){\n    var se = theorySE();\n    $(\"pNum\").value = state.p.toFixed(2);\n    $(\"pRange\").value = state.p;\n    $(\"nNum\").value = state.n;\n    $(\"nRange\").value = Math.min(state.n, 500);\n    $(\"pbar\").style.width = (state.p * 100) + \"%\";\n    $(\"thMean\").textContent = fmt(state.p);\n    $(\"thSD\").textContent = fmt(se);\n    $(\"stMeanSub\").textContent = t(\"theory_pre\") + fmt(state.p);\n    $(\"stSDSub\").textContent = t(\"theory_pre\") + fmt(se);\n    $(\"tMean\").textContent = fmt(state.p);\n    $(\"tSD\").textContent = fmt(se);\n\n    var np = state.n * state.p, nq = state.n * (1 - state.p);\n    var ok = np >= 10 && nq >= 10;\n    var box = $(\"condBox\");\n    box.className = \"cond \" + (ok ? \"ok\" : \"warn\");\n    $(\"condChips\").innerHTML =\n      '\u003cspan class=\"cchip\">np = ' + np.toFixed(1) + '\u003c/span>' +\n      '\u003cspan class=\"cchip\">n(1−p) = ' + nq.toFixed(1) + '\u003c/span>';\n    $(\"condText\").textContent = ok ? t(\"cond_ok\") : t(\"cond_warn\");\n    $(\"probWarn\").hidden = ok;\n\n    document.querySelectorAll(\"#nPresets button\").forEach(function(b){\n      b.classList.toggle(\"active\", parseInt(b.dataset.n, 10) === state.n);\n    });\n    if(!state.cutoffTouched){\n      $(\"cutoff\").value = defaultCutoff().toFixed(2);\n    }\n  }\n\n  function take(k){\n    var n = state.n, p = state.p;\n    for(var r=0;r\u003ck;r++){\n      var s = 0, draws = [];\n      for(var i=0;i\u003cn;i++){\n        var hit = Math.random() \u003c p ? 1 : 0;\n        s += hit;\n        if(r === k-1 && i \u003c 250) draws.push(hit);\n      }\n      var phat = s / n;\n      state.reps.push({ x:s, phat:phat });\n      if(r === k-1) state.last = { x:s, phat:phat, draws:draws };\n    }\n    syncAll();\n  }\n\n  function inTail(val, c, mode, mu){\n    if(mode === \"gt\") return val > c;\n    if(mode === \"lt\") return val \u003c c;\n    if(mode === \"two\") return Math.abs(val - mu) >= Math.abs(c - mu) - 1e-12;\n    return false;\n  }\n\n  function updateProb(){\n    var c = parseFloat($(\"cutoff\").value);\n    if(isNaN(c)) return;\n    c = clamp(c, 0, 1);\n    var se = theorySE(), mu = state.p, z = (c - mu) / se;\n    var N = state.reps.length;\n    var mode = state.tail;\n\n    var lbl = mode === \"lt\" ? \"P(p̂ \u003c \" + c.toFixed(2) + \")\"\n            : mode === \"two\" ? \"P(|p̂ − p| ≥ \" + Math.abs(c - mu).toFixed(2) + \")\"\n            : \"P(p̂ > \" + c.toFixed(2) + \")\";\n    $(\"pEmpLbl\").textContent = lbl;\n\n    var theoP = mode === \"lt\" ? normalCDF(z)\n              : mode === \"two\" ? 2 * (1 - normalCDF(Math.abs(z)))\n              : 1 - normalCDF(z);\n    $(\"pTheoVal\").textContent = (theoP * 100).toFixed(1) + \"%\";\n    $(\"pTheoSub\").textContent = \"N(\" + mu.toFixed(2) + \", \" + fmt(se) + \")\";\n    $(\"pZVal\").textContent = (z >= 0 ? \"+\" : \"\") + z.toFixed(2);\n\n    if(N === 0){\n      $(\"pEmpVal\").textContent = \"—\";\n      $(\"pEmpSub\").textContent = state.lang === \"zh\" ? \"抽样后显示模拟占比\" : \"Draw samples to compare\";\n    } else {\n      var checkMode = mode === \"none\" ? \"gt\" : mode;\n      var cnt = 0;\n      for(var i=0;i\u003cN;i++){ if(inTail(state.reps[i].phat, c, checkMode, mu)) cnt++; }\n      $(\"pEmpVal\").textContent = (cnt / N * 100).toFixed(1) + \"%\";\n      $(\"pEmpSub\").textContent = cnt.toLocaleString() + \" / \" + N.toLocaleString();\n    }\n  }\n\n  function updateStatsAndSample(){\n    var reps = state.reps, N = reps.length, se = theorySE();\n    $(\"stCount\").textContent = N.toLocaleString();\n    $(\"btnCsv\").disabled = N === 0;\n    if(N === 0){\n      $(\"stMean\").textContent = $(\"stSD\").textContent = $(\"stLast\").textContent = \"—\";\n      $(\"stLastSub\").textContent = \"—\";\n      $(\"sMean\").textContent = $(\"sSD\").textContent = $(\"sW1\").textContent = $(\"sW2\").textContent = $(\"sW3\").textContent = $(\"sSkew\").textContent = \"—\";\n      $(\"emptyNote\").hidden = false;\n      $(\"emptyNote\").textContent = t(\"empty\").replace(\"{n}\", state.n);\n      $(\"dots\").innerHTML = \"\";\n      $(\"sampleMeta\").textContent = t(\"last_empty\");\n      return;\n    }\n\n    $(\"emptyNote\").hidden = true;\n    var sum = 0, i;\n    for(i=0;i\u003cN;i++) sum += reps[i].phat;\n    var mean = sum / N;\n    var ss = 0, m3 = 0, c1 = 0, c2 = 0, c3 = 0;\n    for(i=0;i\u003cN;i++){\n      var d = reps[i].phat - mean;\n      ss += d * d;\n      var ad = Math.abs(reps[i].phat - state.p);\n      if(ad \u003c= se) c1++;\n      if(ad \u003c= 2 * se) c2++;\n      if(ad \u003c= 3 * se) c3++;\n    }\n    var sd = N > 1 ? Math.sqrt(ss / (N - 1)) : 0;\n    var skew = NaN;\n    if(N >= 3 && sd > 0){\n      for(i=0;i\u003cN;i++) m3 += Math.pow((reps[i].phat - mean) / sd, 3);\n      skew = m3 * N / ((N - 1) * (N - 2));\n    }\n\n    $(\"stMean\").textContent = fmt(mean);\n    $(\"stSD\").textContent = N > 1 ? fmt(sd) : \"—\";\n    $(\"stLast\").textContent = fmt(state.last.phat);\n    $(\"stLastSub\").textContent = t(\"succ_of\").replace(\"{x}\", state.last.x).replace(\"{n}\", state.n);\n    $(\"sMean\").textContent = fmt(mean);\n    $(\"sSD\").textContent = N > 1 ? fmt(sd) : \"—\";\n    $(\"sW1\").textContent = (c1 / N * 100).toFixed(1) + \"%\";\n    $(\"sW2\").textContent = (c2 / N * 100).toFixed(1) + \"%\";\n    $(\"sW3\").textContent = (c3 / N * 100).toFixed(1) + \"%\";\n    $(\"sSkew\").textContent = fmt(skew, 2);\n\n    var html = \"\";\n    for(i=0;i\u003cstate.last.draws.length;i++){\n      html += '\u003cspan class=\"sdot ' + (state.last.draws[i] ? \"s\" : \"f\") + '\">\u003c/span>';\n    }\n    if(state.n > 250) html += '\u003cspan style=\"font-size:12px;color:var(--ink-3);align-self:center\">… +' + (state.n - 250) + '\u003c/span>';\n    $(\"dots\").innerHTML = html;\n    $(\"sampleMeta\").textContent = t(\"last_meta\")\n      .replace(\"{x}\", state.last.x).replace(\"{n}\", state.n)\n      .replace(\"{phat}\", fmt(state.last.phat)).replace(\"{p}\", state.p.toFixed(2));\n  }\n\n  function drawChart(){\n    var canvas = $(\"chart\"), wrap = canvas.parentElement;\n    var W = wrap.clientWidth, H = canvas.clientHeight || 330;\n    var dpr = window.devicePixelRatio || 1;\n    canvas.width = Math.round(W * dpr);\n    canvas.height = Math.round(H * dpr);\n    var ctx = canvas.getContext(\"2d\");\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    ctx.clearRect(0, 0, W, H);\n\n    var n = state.n, p = state.p, se = theorySE(), reps = state.reps, N = reps.length;\n    var vals = [];\n    for(var i=0;i\u003cN;i++) vals.push(reps[i].phat);\n    var mm = arrMinMax(vals);\n    var lo0 = Math.max(0, p - 4.2 * se), hi0 = Math.min(1, p + 4.2 * se);\n    if(N > 0){ lo0 = Math.min(lo0, mm[0]); hi0 = Math.max(hi0, mm[1]); }\n    var minW = Math.max(0.08, 6 / n);\n    if(hi0 - lo0 \u003c minW){\n      var mid = (lo0 + hi0) / 2;\n      lo0 = clamp(mid - minW / 2, 0, 1 - minW);\n      hi0 = clamp(lo0 + minW, minW, 1);\n    }\n\n    // Discrete-aligned binning on k = 0..n\n    var kMin = Math.max(0, Math.floor(lo0 * n));\n    var kMax = Math.min(n, Math.ceil(hi0 * n));\n    var kSpan = Math.max(1, kMax - kMin + 1);\n    var g = Math.max(1, Math.ceil(kSpan / 34));\n    var bins = Math.ceil(kSpan / g);\n    var bw = g / n;\n    var counts = new Array(bins).fill(0);\n    for(i=0;i\u003cN;i++){\n      var idx = Math.floor((reps[i].x - kMin) / g);\n      if(idx \u003c 0) idx = 0; if(idx >= bins) idx = bins - 1;\n      counts[idx]++;\n    }\n\n    var axLo = Math.max(0, (kMin - 0.5) / n);\n    var axHi = Math.min(1, (kMin + bins * g - 0.5) / n);\n    if(axHi \u003c= axLo){ axLo = 0; axHi = 1; }\n\n    var maxC = 1;\n    for(i=0;i\u003cbins;i++){ if(counts[i] > maxC) maxC = counts[i]; }\n    var showCurve = $(\"chkCurve\").checked;\n    if(showCurve && N > 0 && se > 0){\n      var peak = N * bw * normalPDF(p, p, se);\n      if(peak > maxC) maxC = peak;\n    }\n    var yMax = maxC * 1.14;\n\n    var padL = 44, padR = 14, padT = 16, padB = 34;\n    var cw = W - padL - padR, ch = H - padT - padB;\n    function X(v){ return padL + (v - axLo) / (axHi - axLo) * cw; }\n    function Y(c){ return padT + ch - (c / yMax) * ch; }\n\n    var ink = cssVar(\"--ink\"), muted = cssVar(\"--ink-3\"), line = cssVar(\"--line\"),\n        sage = cssVar(\"--sage\"), accent = cssVar(\"--accent\"), danger = cssVar(\"--danger\");\n\n    // Gridlines\n    ctx.font = \"11px ui-monospace, Menlo, monospace\";\n    ctx.lineWidth = 1;\n    for(var s=0;s\u003c=4;s++){\n      var cval = (yMax / 1.14) * s / 4, yy = Y(cval);\n      ctx.strokeStyle = line;\n      ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(W - padR, yy); ctx.stroke();\n      ctx.fillStyle = muted; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\";\n      ctx.fillText(Math.round(cval).toString(), padL - 7, yy);\n    }\n\n    var cCut = parseFloat($(\"cutoff\").value);\n    var tailMode = state.tail;\n\n    // Bars\n    for(var b=0;b\u003cbins;b++){\n      if(!counts[b]) continue;\n      var xL = Math.max(axLo, (kMin + b * g - 0.5) / n);\n      var xR = Math.min(axHi, (kMin + (b + 1) * g - 0.5) / n);\n      var midB = (kMin + b * g + (g - 1) / 2) / n;\n      var shaded = !isNaN(cCut) && inTail(midB, cCut, tailMode, p);\n      ctx.fillStyle = shaded ? accent : sage;\n      ctx.globalAlpha = shaded ? 0.92 : (tailMode === \"none\" ? 0.84 : 0.42);\n      var px0 = X(xL) + 0.6, px1 = X(xR) - 0.6;\n      var bh = (counts[b] / yMax) * ch;\n      ctx.fillRect(px0, Y(counts[b]), Math.max(2, px1 - px0), bh);\n    }\n    ctx.globalAlpha = 1;\n\n    // Normal curve + tail fill\n    if(showCurve && N > 0 && se > 0){\n      var steps = 160;\n      if(tailMode !== \"none\" && !isNaN(cCut)){\n        ctx.fillStyle = accent;\n        ctx.globalAlpha = 0.22;\n        function shadeInterval(a, bnd){\n          if(bnd \u003c= a) return;\n          ctx.beginPath();\n          ctx.moveTo(X(a), Y(0));\n          for(var j=0;j\u003c=80;j++){\n            var xv = a + (bnd - a) * j / 80;\n            ctx.lineTo(X(xv), Y(N * bw * normalPDF(xv, p, se)));\n          }\n          ctx.lineTo(X(bnd), Y(0));\n          ctx.closePath();\n          ctx.fill();\n        }\n        if(tailMode === \"gt\" && cCut \u003c axHi) shadeInterval(Math.max(axLo, cCut), axHi);\n        if(tailMode === \"lt\" && cCut > axLo) shadeInterval(axLo, Math.min(axHi, cCut));\n        if(tailMode === \"two\"){\n          var dCut = Math.abs(cCut - p);\n          var leftCut = p - dCut, rightCut = p + dCut;\n          if(leftCut > axLo) shadeInterval(axLo, Math.min(axHi, leftCut));\n          if(rightCut \u003c axHi) shadeInterval(Math.max(axLo, rightCut), axHi);\n        }\n        ctx.globalAlpha = 1;\n      }\n\n      ctx.beginPath(); ctx.strokeStyle = accent; ctx.lineWidth = 2.4;\n      for(var px=0;px\u003c=steps;px++){\n        var xv2 = axLo + (axHi - axLo) * px / steps;\n        var yv2 = Y(N * bw * normalPDF(xv2, p, se));\n        if(px === 0) ctx.moveTo(X(xv2), yv2); else ctx.lineTo(X(xv2), yv2);\n      }\n      ctx.stroke();\n    }\n\n    // Cutoff line\n    if(tailMode !== \"none\" && !isNaN(cCut) && cCut >= axLo && cCut \u003c= axHi){\n      ctx.strokeStyle = accent; ctx.lineWidth = 1.8; ctx.setLineDash([4, 3]);\n      ctx.beginPath(); ctx.moveTo(X(cCut), padT); ctx.lineTo(X(cCut), Y(0)); ctx.stroke();\n      ctx.setLineDash([]);\n      ctx.fillStyle = accent; ctx.font = \"700 11px ui-monospace, Menlo, monospace\";\n      ctx.textAlign = cCut > (axLo + axHi) / 2 ? \"right\" : \"left\"; ctx.textBaseline = \"top\";\n      ctx.fillText(\"c=\" + cCut.toFixed(2), X(cCut) + (cCut > (axLo + axHi)/2 ? -5 : 5), padT + 2);\n    }\n\n    // Simulated mean line\n    if($(\"chkMean\").checked && N > 0){\n      var sm = 0; for(i=0;i\u003cN;i++) sm += reps[i].phat; sm /= N;\n      var mx = X(sm);\n      ctx.strokeStyle = danger; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);\n      ctx.beginPath(); ctx.moveTo(mx, padT); ctx.lineTo(mx, Y(0)); ctx.stroke(); ctx.setLineDash([]);\n      ctx.fillStyle = danger; ctx.font = \"700 11.5px ui-monospace, Menlo, monospace\";\n      ctx.textAlign = sm > (axLo + axHi) / 2 ? \"right\" : \"left\"; ctx.textBaseline = \"top\";\n      ctx.fillText((state.lang===\"zh\"?\"均值=\":\"mean=\") + fmt(sm), mx + (sm > (axLo + axHi)/2 ? -6 : 6), padT + 15);\n    }\n\n    // True p vertical marker\n    if(p >= axLo && p \u003c= axHi){\n      ctx.strokeStyle = ink; ctx.lineWidth = 1.4; ctx.setLineDash([2, 3]);\n      ctx.beginPath(); ctx.moveTo(X(p), padT); ctx.lineTo(X(p), Y(0)); ctx.stroke(); ctx.setLineDash([]);\n    }\n\n    // Axis & ticks\n    ctx.strokeStyle = muted; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0)); ctx.stroke();\n    ctx.fillStyle = muted; ctx.font = \"11px ui-monospace, Menlo, monospace\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"top\";\n    for(var tk=0;tk\u003c=4;tk++){\n      var tv = axLo + (axHi - axLo) * tk / 4;\n      ctx.fillText(tv.toFixed(2), X(tv), Y(0) + 7);\n    }\n    ctx.fillStyle = ink; ctx.font = \"700 11px ui-monospace, Menlo, monospace\";\n    if(p >= axLo && p \u003c= axHi) ctx.fillText(\"p=\" + p.toFixed(2), X(p), Y(0) + 20);\n  }\n\n  function syncAll(){\n    syncTheory();\n    updateStatsAndSample();\n    updateProb();\n    drawChart();\n  }\n\n  function resetWithParam(){\n    state.reps = [];\n    state.last = null;\n    syncAll();\n  }\n\n  // Init listeners strictly once\n  $(\"pRange\").addEventListener(\"input\", function(){ state.p = clamp(parseFloat(this.value), 0.02, 0.98); resetWithParam(); });\n  $(\"pNum\").addEventListener(\"change\", function(){\n    var v = parseFloat(this.value);\n    state.p = isNaN(v) ? 0.50 : clamp(Math.round(v * 100) / 100, 0.02, 0.98);\n    resetWithParam();\n  });\n  $(\"nRange\").addEventListener(\"input\", function(){ state.n = clamp(parseInt(this.value, 10), 5, 1000); resetWithParam(); });\n  $(\"nNum\").addEventListener(\"change\", function(){\n    var v = parseInt(this.value, 10);\n    state.n = isNaN(v) ? 25 : clamp(v, 5, 1000);\n    resetWithParam();\n  });\n  document.querySelectorAll(\"#nPresets button\").forEach(function(b){\n    b.addEventListener(\"click\", function(){ state.n = parseInt(this.dataset.n, 10); resetWithParam(); });\n  });\n\n  $(\"btn1\").addEventListener(\"click\", function(){ take(1); });\n  $(\"btn10\").addEventListener(\"click\", function(){ take(10); });\n  $(\"btn100\").addEventListener(\"click\", function(){ take(100); });\n  $(\"btn1000\").addEventListener(\"click\", function(){ take(1000); });\n  $(\"btnReset\").addEventListener(\"click\", resetWithParam);\n  $(\"chkCurve\").addEventListener(\"change\", drawChart);\n  $(\"chkMean\").addEventListener(\"change\", drawChart);\n\n  $(\"cutoff\").addEventListener(\"input\", function(){ state.cutoffTouched = true; updateProb(); drawChart(); });\n  document.querySelectorAll(\"[data-tail]\").forEach(function(btn){\n    btn.addEventListener(\"click\", function(){\n      state.tail = this.dataset.tail;\n      document.querySelectorAll(\"[data-tail]\").forEach(function(x){ x.setAttribute(\"aria-pressed\", String(x === btn)); });\n      updateProb(); drawChart();\n    });\n  });\n\n  $(\"btnCsv\").addEventListener(\"click\", function(){\n    if(!state.reps.length) return;\n    var rows = [\"rep,successes,n,phat\"];\n    for(var i=0;i\u003cstate.reps.length;i++){\n      rows.push((i+1) + \",\" + state.reps[i].x + \",\" + state.n + \",\" + state.reps[i].phat.toFixed(6));\n    }\n    var blob = new Blob([rows.join(\"\\n\")], {type:\"text/csv\"});\n    var a = document.createElement(\"a\");\n    a.href = URL.createObjectURL(blob);\n    a.download = \"sampling-proportion-n\" + state.n + \".csv\";\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);\n  });\n\n  $(\"langZh\").addEventListener(\"click\", function(){ state.lang = \"zh\"; try{localStorage.setItem(\"mg-sampling-lang\",\"zh\");}catch(e){} applyLang(); });\n  $(\"langEn\").addEventListener(\"click\", function(){ state.lang = \"en\"; try{localStorage.setItem(\"mg-sampling-lang\",\"en\");}catch(e){} applyLang(); });\n\n  document.addEventListener(\"keydown\", function(e){\n    if(e.code === \"Space\" && !/INPUT|BUTTON|SELECT|TEXTAREA/.test(document.activeElement.tagName)){\n      e.preventDefault(); take(1);\n    }\n  });\n\n  var resizeT = null;\n  window.addEventListener(\"resize\", function(){ clearTimeout(resizeT); resizeT = setTimeout(drawChart, 100); });\n  if(window.matchMedia){\n    var mq = window.matchMedia(\"(prefers-color-scheme: dark)\");\n    if(mq.addEventListener) mq.addEventListener(\"change\", drawChart);\n  }\n\n  try { var saved = localStorage.getItem(\"mg-sampling-lang\"); if(saved === \"en\" || saved === \"zh\") state.lang = saved; } catch(e){}\n  applyLang();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003clink rel=\"icon\" href=\"data:,\">\n\u003ctitle>两样本比例之差的抽样分布模拟器 · Difference of Sample Proportions\u003c/title>\n\u003cscript>\ntry { if (window.self !== window.top) document.documentElement.classList.add('in-embed'); }\ncatch (e) { document.documentElement.classList.add('in-embed'); }\n\u003c/script>\n\u003cstyle>\n:root{\n  --ground:#F7F8FA; --surface:#FFFFFF; --surface-2:#F0F1F4; --line:#D6D8DA; --line-soft:#E8EAED;\n  --navy:#1865F2; --navy-2:#1152CC; --navy-soft:#EBF3FF;\n  --ink:#21242C; --ink-2:#525760; --ink-3:#6E737D;\n  --sage:#008A6E; --sage-soft:#E6F7F2;\n  --accent:#C75000; --accent-soft:#FFF3E8;\n  --gold:#B45309; --gold-soft:#FEF3C7; --gold-bright:#D97706;\n  --danger:#C5221F; --danger-soft:#FEECEB;\n  --serif:Georgia,\"Times New Roman\",\"Songti SC\",serif;\n  --sans:\"Lato\",-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"PingFang SC\",\"Hiragino Sans GB\",\"Segoe UI\",\"Microsoft YaHei\",sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;\n  --shadow-sm:0 1px 3px rgba(33,36,44,.06);\n  --r-md:8px; --r-sm:6px;\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}\nbutton,input,select{font:inherit;color:inherit}\nbutton,input[type=number],select{min-height:40px}\n:focus-visible{outline:2.5px solid var(--navy);outline-offset:2px;border-radius:var(--r-sm)}\n.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}\n\n.sim-nav{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 18px}\n.sim-nav-inner{max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.sim-nav a,.sim-nav strong{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}\n.sim-nav a.sim-back{color:var(--navy);border:1px solid var(--line);border-radius:6px;margin-right:6px;font-weight:700}\n.sim-nav a.sim-back:hover{background:var(--navy-soft);border-color:var(--navy);color:var(--navy)}\n.sim-nav a{color:var(--ink-2);border:1px solid transparent}\n.sim-nav a:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink)}\n.sim-nav strong{background:var(--navy);color:#fff;border:1px solid var(--navy)}\n.in-embed .sim-nav{display:none}\n\n.wrap{max-width:1160px;margin:0 auto;padding:18px 18px 40px}\nheader.top{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}\n.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}\n.kicker{font:700 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin:0 0 6px}\nh1{font:800 clamp(24px,3.6vw,34px)/1.18 var(--sans);margin:0;letter-spacing:-.02em}\nh1 em{font-style:normal;color:var(--navy)}\n.sub{margin:8px 0 0;color:var(--ink-2);font-size:15px;max-width:740px}\n\n.lang-switch{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;box-shadow:var(--shadow-sm);flex:none}\n.lang-switch button{min-height:30px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:700;cursor:pointer}\n.l (--pc);background:var(--psoft);padding:4px 9px;border-radius:999px}\n\n.ctl{margin-bottom:12px}\n.label-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}\n.label-row label{font-size:13.5px;font-weight:700}\n.num-input{width:82px;padding:4px 8px;text-align:right;font-family:var(--mono);font-weight:700;font-size:14.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;min-height:36px}\ninput[type=range]{width:100%;accent-color:var(--pc);height:30px;margin:0;cursor:pointer}\n.n-presets{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}\n.n-presets button{min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}\n.n-presets button:hover{border-color:var(--pc);color:var(--ink)}\n\n.pbar{display:flex;height:10px;border-radius:999px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);margin-top:6px}\n.pbar .yes{background:var(--pc);transition:width .14s ease}\n.pbar-legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:3px}\n\n/* Condition strip */\n.cond-strip{margin-top:14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}\n.cond-chips{display:flex;flex-wrap:wrap;gap:6px}\n.cchip{font:700 12px/1.2 var(--mono);padding:4px 10px;border-radius:999px;background:var(--sage-soft);color:var(--sage);border:1px solid rgba(29,107,83,.25)}\n.cchip.fail{background:var(--danger-soft);color:var(--danger);border-color:rgba(180,52,47,.3)}\n.cond-verdict{font-size:13.5px;color:var(--ink-2);margin:0}\n.cond-verdict b{color:var(--ink)}\n\n/* Action bar */\n.action-bar{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 15px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;box-shadow:var(--shadow-sm)}\n.btn:hover{border-color:var(--navy)}\n.btn:active{transform:translateY(1px)}\n.btn.primary{background:var(--sage);color:#fff;border-color:var(--sage)}\n.btn.reset{color:var(--danger)}\n.btn:disabled{opacity:.45;cursor:default;transform:none}\n.spacer{flex:1}\n.tog-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;min-height:38px}\n.tog-pill input{width:16px;height:16px;accent-color:var(--sage);cursor:pointer}\n\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}\n@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}\n.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-sm)}\n.stat .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}\n.stat .v{font-family:var(--mono);font-size:23px;font-weight:800;line-height:1.2;margin-top:3px}\n.stat .s{font-size:12px;color:var(--ink-2);margin-top:2px}\n.stat.highlight{border-color:var(--sage);background:var(--sage-soft)}\n.stat.highlight .v{color:var(--sage)}\n\n.main-grid{display:grid;grid-template-columns:1.65fr 1fr;gap:14px;margin-top:14px;align-items:start}\n@media(max-width:920px){.main-grid{grid-template-columns:1fr}}\n\n.chart-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}\n.chart-head h2{margin:0}\n.legend{display:flex;gap:12px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}\n.legend span{display:inline-flex;align-items:center;gap:5px}\n.swatch{display:inline-block;width:12px;height:12px;border-radius:3px}\n.swatch-line{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--accent)}\n.swatch-dash{display:inline-block;width:16px;height:0;border-top:2px dashed var(--danger)}\ncanvas{width:100%;height:330px;display:block}\n@media(max-width:640px){canvas{height:270px}}\n.empty-note{text-align:center;color:var(--ink-2);font-size:13.5px;padding:10px 12px;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;margin-top:8px}\n\n.prob-card{margin-top:14px}\n.prob-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}\n.prob-input-wrap{display:flex;align-items:center;gap:8px}\n.prob-input-wrap label{font-size:13.5px;font-weight:700}\n.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}\n.seg button{min-height:32px;padding:0 12px;border:0;border-radius:999px;background:transparent;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:#fff}\n.prob-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}\n@media(max-width:640px){.prob-grid{grid-template-columns:1fr}}\n.pbox{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}\n.pbox .pk{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}\n.pbox .pv{font:800 20px/1.25 var(--mono);margin-top:3px}\n.pbox .ps{font-size:12px;color:var(--ink-2);margin-top:2px}\n.prob-warn{margin-top:8px;font-size:12.5px;color:#92400E;background:var(--gold-soft);padding:6px 10px;border-radius:8px}\n\n.side{display:grid;gap:14px}\n.samp{margin-bottom:10px}\n.shead{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}\n.who.c1{font-weight:700;color:var(--sage)}\n.who.c2{font-weight:700;color:var(--accent)}\n.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}\n.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:block}\n.dots i.on1{background:var(--sage);border-color:var(--sage)}\n.dots i.on2{background:var(--accent);border-color:var(--accent)}\n.propbar{display:flex;height:10px;border-radius:999px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);margin-top:6px}\n.propbar .fill1{background:var(--sage)}\n.propbar .fill2{background:var(--accent)}\n.diffbox{border-top:1px dashed var(--line);padding-top:10px;margin-top:6px;display:flex;justify-content:space-between;align-items:baseline}\n.diffbox .dval{font:800 22px/1.1 var(--mono);color:var(--navy)}\n\ntable.check-tbl{width:100%;border-collapse:collapse;font-size:13.5px}\ntable.check-tbl th,table.check-tbl td{padding:7px 5px;border-bottom:1px solid var(--line-soft);text-align:right}\ntable.check-tbl th:first-child,table.check-tbl td:first-child{text-align:left}\ntable.check-tbl th{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}\ntable.check-tbl td.mono{font-family:var(--mono);font-weight:600}\ntable.check-tbl tr:last-child td{border-bottom:none}\n\nfooter{margin-top:18px;font-size:12.5px;color:var(--ink-3);text-align:center}\n.kbd{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 6px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cnav class=\"sim-nav\" aria-label=\"选择模拟器\">\n  \u003cdiv class=\"sim-nav-inner\">\n    \u003ca class=\"sim-back\" href=\"../homework.html\">← 返回 AP 统计\u003c/a>\n    \u003ca href=\"proportion.html\" data-i18n=\"nav_p\">样本比例 p̂\u003c/a>\n    \u003cstrong aria-current=\"page\" data-i18n=\"nav_pd\">两样本比例差 p̂₁ − p̂₂\u003c/strong>\n    \u003ca href=\"mean.html\" data-i18n=\"nav_m\">样本均值 x̄\u003c/a>\n    \u003ca href=\"mean-difference.html\" data-i18n=\"nav_md\">两样本均值差 x̄₁ − x̄₂\u003c/a>\n  \u003c/div>\n\u003c/nav>\n\n\u003cdiv class=\"wrap\">\n  \u003cheader class=\"top\">\n    \u003cdiv class=\"head-row\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">AP Statistics · Sampling Distribution · Two Proportions\u003c/p>\n        \u003ch1 data-i18n-html=\"h1\">两样本比例之差的抽样分布 \u003cem>p̂₁ − p̂₂\u003c/em>\u003c/h1>\n        \u003cp class=\"sub\" data-i18n-html=\"sub\">分别设定两组总体的比例与样本量，每次独立抽取一对样本并记录差值 \u003cb>p̂₁ − p̂₂\u003c/b>，检验中心、方差相加性质与大样本正态近似。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"lang-switch\" role=\"group\" aria-label=\"Language toggle\">\n        \u003cbutton type=\"button\" id=\"langZh\" aria-pressed=\"true\">中文\u003c/button>\n        \u003cbutton type=\"button\" id=\"langEn\" aria-pressed=\"false\">EN\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula\">\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_mean\">中心\u003c/span>\u003cspan class=\"eq\">μ = \u003ci>p\u003c/i>\u003csub>1\u003c/sub> − \u003ci>p\u003c/i>\u003csub>2\u003c/sub> = \u003cb id=\"fMu\">0.200\u003c/b>\u003c/span>\u003c/span>\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_sd\">标准误 (SE)\u003c/span>\u003cspan class=\"eq\">σ = \u003cmath>\u003cmsqrt>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/msqrt>\u003c/math> = \u003cb id=\"fSE\">0.098\u003c/b>\u003c/span>\u003c/span>\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_cond\">条件\u003c/span>\u003cspan class=\"eq\">n₁p₁, n₁(1−p₁), n₂p₂, n₂(1−p₂) ≥ 10\u003c/span>\u003c/span>\n    \u003c/div>\n\n    \u003cdetails class=\"guide-box\">\n      \u003csummary data-i18n=\"guide_title\">课堂练习引导（Worksheet Guide）\u003c/summary>\n      \u003cp data-i18n=\"guide_body\">第 2–3 页：分别设置两组的 p 和 n。每次抽 1,000 对样本，在右侧对照表读取差值的均值和 SD，同时也可直接查看单组 p̂₁、p̂₂ 各自的标准差，验证方差相加规律。\u003c/p>\n    \u003c/details>\n  \u003c/header>\n\n  \u003cdiv class=\"setup\">\n    \u003csection class=\"card pop-card g1\" aria-label=\"Population 1\">\n      \u003cdiv class=\"pop-head\">\n        \u003ch3 data-i18n=\"pop1_t\">总体 1 · Population 1\u003c/h3>\n        \u003cspan class=\"tag\">p₁ · n₁\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"p1Range\" data-i18n=\"lbl_p1\">总体比例 p₁\u003c/label>\u003cinput type=\"number\" class=\"num-input\" id=\"p1Num\" min=\"0.01\" max=\"0.99\" step=\"0.01\" value=\"0.60\">\u003c/div>\n        \u003cinput type=\"range\" id=\"p1Range\" min=\"0.01\" max=\"0.99\" step=\"0.01\" value=\"0.60\">\n        \u003cdiv class=\"pbar\" aria-hidden=\"true\">\u003cdiv class=\"yes\" id=\"pbar1\" style=\"width:60%\">\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"n1Range\" data-i18n=\"lbl_n1\">样本量 n₁\u003c/label>\u003cinput type=\"number\" class=\"num-input\" id=\"n1Num\" min=\"5\" max=\"1000\" step=\"1\" value=\"50\">\u003c/div>\n        \u003cinput type=\"range\" id=\"n1Range\" min=\"5\" max=\"500\" step=\"5\" value=\"50\">\n        \u003cdiv class=\"n-presets\">\n          \u003cbutton type=\"button\" data-g=\"1\" data-n=\"20\">20\u003c/button>\n          \u003cbutton type=\"button\" data-g=\"1\" data-n=\"50\">50\u003c/button>\n          \u003cbutton type=\"button\" data-g=\"1\" data-n=\"100\">100\u003c/button>\n          \u003cbutton type=\"button\" data-g=\"1\" data-n=\"200\">200\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"card pop-card g2\" aria-label=\"Population 2\">\n      \u003cdiv class=\"pop-head\">\n        \u003ch3 data-i18n=\"pop2_t\">总体 2 · Population 2\u003c/h3>\n        \u003cspan class=\"tag\">p₂ · n₂\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"p2Range\" data-i18n=\"lbl_p2\">总体比例 p₂\u003c/label>\u003cinput type=\"number\" class=\"num-input\" id=\"p2Num\" min=\"0.01\" max=\"0.99\" step=\"0.01\" value=\"0.40\">\u003c/div>\n        \u003cinput type=\"range\" id=\"p2Range\" min=\"0.01\" max=\"0.99\" step=\"0.01\" value=\"0.40\">\n        \u003cdiv class=\"pbar\" aria-hidden=\"true\">\u003cdiv class=\"yes\" id=\"pbar2\" style=\"width:40%\">\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"n2Range\" data-i18n=\"lbl_n2\">样本量 n₂\u003c/label>\u003cinput type=\"number\" class=\"num-input\" id=\"n2Num\" min=\"5\" max=\"1000\" step=\"1\" value=\"50\">\u003c/div>\n        \u003cinput type=\"range\" id=\"n2Range\" min=\"5\" max=\"500\" step=\"5\" value=\"50\">\n        \u003cdiv class=\"n-presets\">\n          \u003cbutton type=\"button\" data-g=\"2\" data-n=\"20\">20\u003c/button>\n          \u003cbutton type=\"button\" data-g=\"2\" data-n=\"50\">50\u003c/button>\n          \u003cbutton type=\"button\" data-g=\"2\" data-n=\"100\">100\u003c/button>\n          \u003cbutton type=\"button\" data-g=\"2\" data-n=\"200\">200\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\n  \u003csection class=\"card cond-strip\" aria-label=\"Large Counts condition\">\n    \u003cdiv class=\"cond-chips\" id=\"condChips\">\u003c/div>\n    \u003cp class=\"cond-verdict\" id=\"condVerdict\">\u003c/p>\n  \u003c/section>\n\n  \u003cdiv class=\"action-bar\" role=\"group\" aria-label=\"抽样控制\">\n    \u003cbutton type=\"button\" class=\"btn primary\" id=\"draw1\" data-i18n=\"btn_1\">抽 1 对样本\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"draw10\">+ 10\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"draw100\">+ 100\u003c/button>\n    \u  c=1-Math.exp(-0.5*a*a)/Math.sqrt(2*Math.PI)*poly;\n    return z>=0 ? c : 1-c;\n  }\n  function sdOfArr(arr){\n    var n=arr.length; if(n\u003c2) return NaN;\n    var s=0,i; for(i=0;i\u003cn;i++) s+=arr[i];\n    var m=s/n, ss=0;\n    for(i=0;i\u003cn;i++){ var d=arr[i]-m; ss+=d*d; }\n    return Math.sqrt(ss/(n-1));\n  }\n  function theory(){\n    var mu = state.p1 - state.p2;\n    var sd1 = Math.sqrt(state.p1*(1-state.p1)/state.n1);\n    var sd2 = Math.sqrt(state.p2*(1-state.p2)/state.n2);\n    return { mu:mu, sd1:sd1, sd2:sd2, se:Math.sqrt(sd1*sd1+sd2*sd2) };\n  }\n  function inTail(val, c, mode, mu){\n    if(mode===\"gt\") return val > c;\n    if(mode===\"lt\") return val \u003c c;\n    if(mode===\"two\") return Math.abs(val-mu) >= Math.abs(c-mu) - 1e-12;\n    return false;\n  }\n\n  function applyLang(){\n    document.documentElement.lang = state.lang === \"zh\" ? \"zh-CN\" : \"en\";\n    $(\"langZh\").setAttribute(\"aria-pressed\", String(state.lang===\"zh\"));\n    $(\"langEn\").setAttribute(\"aria-pressed\", String(state.lang===\"en\"));\n    document.querySelectorAll(\"[data-i18n]\").forEach(function(el){ el.textContent = t(el.dataset.i18n); });\n    document.querySelectorAll(\"[data-i18n-html]\").forEach(function(el){ el.innerHTML = t(el.dataset.i18nHtml); });\n    syncAll();\n  }\n\n  function syncTheory(){\n    var th = theory();\n    $(\"p1Num\").value = state.p1.toFixed(2); $(\"p1Range\").value = state.p1;\n    $(\"p2Num\").value = state.p2.toFixed(2); $(\"p2Range\").value = state.p2;\n    $(\"n1Num\").value = state.n1; $(\"n1Range\").value = Math.min(state.n1, 500);\n    $(\"n2Num\").value = state.n2; $(\"n2Range\").value = Math.min(state.n2, 500);\n    $(\"pbar1\").style.width = (state.p1*100) + \"%\";\n    $(\"pbar2\").style.width = (state.p2*100) + \"%\";\n\n    $(\"fMu\").textContent = fmt(th.mu);\n    $(\"fSE\").textContent = fmt(th.se);\n    $(\"stMeanSub\").textContent = t(\"theory_pre\") + fmt(th.mu);\n    $(\"stSDSub\").textContent = t(\"theory_pre\") + fmt(th.se);\n    $(\"tMean\").textContent = fmt(th.mu);\n    $(\"tSD\").textContent = fmt(th.se);\n    $(\"tSD1\").textContent = fmt(th.sd1);\n    $(\"tSD2\").textContent = fmt(th.sd2);\n\n    var checks = [\n      { l:\"n₁p₁\", v:state.n1*state.p1 },\n      { l:\"n₁(1−p₁)\", v:state.n1*(1-state.p1) },\n      { l:\"n₂p₂\", v:state.n2*state.p2 },\n      { l:\"n₂(1−p₂)\", v:state.n2*(1-state.p2) }\n    ];\n    var html = \"\", okAll = true;\n    checks.forEach(function(c){\n      var ok = c.v >= 10; if(!ok) okAll = false;\n      html += '\u003cspan class=\"cchip' + (ok?\"\":\" fail\") + '\">' + c.l + \" = \" + c.v.toFixed(1) + \"\u003c/span>\";\n    });\n    $(\"condChips\").innerHTML = html;\n    $(\"condVerdict\").innerHTML = okAll ? t(\"cond_ok\") : t(\"cond_warn\");\n    $(\"probWarn\").hidden = okAll;\n  }\n\n  function drawBinom(n, p){\n    var x=0; for(var i=0;i\u003cn;i++) if(Math.random()\u003cp) x++;\n    return x;\n  }\n  function drawPairs(k){\n    for(var i=0;i\u003ck;i++){\n      var x1 = drawBinom(state.n1, state.p1);\n      var x2 = drawBinom(state.n2, state.p2);\n      var ph1 = x1 / state.n1, ph2 = x2 / state.n2;\n      state.reps.push({ x1:x1, x2:x2, ph1:ph1, ph2:ph2, diff:ph1 - ph2 });\n    }\n    syncAll();\n  }\n\n  function sampleViz(x, n, g){\n    if(n \u003c= 120){\n      var h = '\u003cdiv class=\"dots\" aria-hidden=\"true\">';\n      for(var i=0;i\u003cn;i++) h += '\u003ci class=\"' + (i\u003cx ? \"on\"+g : \"\") + '\">\u003c/i>';\n      return h + '\u003c/div>';\n    }\n    return '\u003cdiv class=\"propbar\" aria-hidden=\"true\">\u003cdiv class=\"fill'+g+'\" style=\"width:'+(x/n*100).toFixed(1)+'%\">\u003c/div>\u003c/div>';\n  }\n\n  function updateStatsAndLatest(){\n    var reps = state.reps, N = reps.length, th = theory();\n    $(\"stCount\").textContent = N.toLocaleString();\n    $(\"csvBtn\").disabled = N === 0;\n    if(N === 0){\n      $(\"stMean\").textContent = $(\"stSD\").textContent = $(\"stLast\").textContent = \"—\";\n      $(\"stLastSub\").textContent = \"—\";\n      $(\"sMean\").textContent = $(\"sSD\").textContent = $(\"sSD1\").textContent = $(\"sSD2\").textContent = $(\"sW1\").textContent = $(\"sW2\").textContent = $(\"sW3\").textContent = \"—\";\n      $(\"emptyNote\").hidden = false;\n      $(\"emptyNote\").textContent = t(\"empty\");\n      $(\"latestBody\").innerHTML = '\u003cp style=\"margin:0;color:var(--ink-2);font-size:13.5px\">' + t(\"last_empty\") + '\u003c/p>';\n      return;\n    }\n\n    $(\"emptyNote\").hidden = true;\n    var diffs = [], p1s = [], p2s = [], sum = 0, c1 = 0, c2 = 0, c3 = 0, i;\n    for(i=0;i\u003cN;i++){\n      var r = reps[i];\n      diffs.push(r.diff); p1s.push(r.ph1); p2s.push(r.ph2);\n      sum += r.diff;\n      var ad = Math.abs(r.diff - th.mu);\n      if(ad \u003c= th.se) c1++;\n      if(ad \u003c= 2*th.se) c2++;\n      if(ad \u003c= 3*th.se) c3++;\n    }\n    var mean = sum / N, sd = sdOfArr(diffs), sd1 = sdOfArr(p1s), sd2 = sdOfArr(p2s);\n    var last = reps[N - 1];\n    $(\"stMean\").textContent = fmt(mean);\n    $(\"stSD\").textContent = N > 1 ? fmt(sd) : \"—\";\n    $(\"stLast\").textContent = fmtSigned(last.diff);\n    $(\"stLastSub\").textContent = last.ph1.toFixed(3) + \" − \" + last.ph2.toFixed(3);\n    $(\"sMean\").textContent = fmt(mean);\n    $(\"sSD\").textContent = N > 1 ? fmt(sd) : \"—\";\n    $(\"sSD1\").textContent = N > 1 ? fmt(sd1) : \"—\";\n    $(\"sSD2\").textContent = N > 1 ? fmt(sd2) : \"—\";\n    $(\"sW1\").textContent = (c1 / N * 100).toFixed(1) + \"%\";\n    $(\"sW2\").textContent = (c2 / N * 100).toFixed(1) + \"%\";\n    $(\"sW3\").textContent = (c3 / N * 100).toFixed(1) + \"%\";\n\n    $(\"latestBody\").innerHTML =\n      '\u003cdiv class=\"samp\">\u003cdiv class=\"shead\">\u003cspan class=\"who c1\">' + t(\"s1\") + '\u003c/span>\u003cspan class=\"mono\">' + last.x1 + ' / ' + state.n1 + ' = ' + last.ph1.toFixed(3) + '\u003c/span>\u003c/div>' + sampleViz(last.x1, state.n1, 1) + '\u003c/div>' +\n      '\u003cdiv class=\"samp\">\u003cdiv class=\"shead\">\u003cspan class=\"who c2\">' + t(\"s2\") + '\u003c/span>\u003cspan class=\"mono\">' + last.x2 + ' / ' + state.n2 + ' = ' + last.ph2.toFixed(3) + '\u003c/span>\u003c/div>' + sampleViz(last.x2, state.n2, 2) + '\u003c/div>' +\n      '\u003cdiv class=\"diffbox\">\u003cspan style=\"font-size:13.5px;color:var(--ink-2)\">' + t(\"diff_lbl\") + '\u003c/span>\u003cspan class=\"dval\">' + fmtSigned(last.diff) + '\u003c/span>\u003c/div>';\n  }\n\n  function updateProb(){\n    var c = parseFloat($(\"cutoff\").value);\n    if(isNaN(c)) return;\n    c = clamp(c, -1, 1);\n    var th = theory(), z = th.se > 0 ? (c - th.mu) / th.se : 0;\n    var mode = state.tail, N = state.reps.length;\n\n    $(\"pEmpLbl\").textContent = mode === \"lt\" ? \"P(diff \u003c \" + c.toFixed(2) + \")\"\n      : mode === \"two\" ? \"P(|diff − μ| ≥ \" + Math.abs(c - th.mu).toFixed(2) + \")\"\n      : \"P(diff > \" + c.toFixed(2) + \")\";\n\n    var theoP = mode === \"lt\" ? normalCDF(z)\n              : mode === \"two\" ? 2 * (1 - normalCDF(Math.abs(z)))\n              : 1 - normalCDF(z);\n    $(\"pTheoVal\").textContent = (theoP * 100).toFixed(1) + \"%\";\n    $(\"pTheoSub\").textContent = \"N(\" + fmt(th.mu) + \", \" + fmt(th.se) + \")\";\n    $(\"pZVal\").textContent = (z >= 0 ? \"+\" : \"\") + z.toFixed(2);\n\n    if(N === 0){\n      $(\"pEmpVal\").textContent = \"—\";\n      $(\"pEmpSub\").textContent = state.lang === \"zh\" ? \"抽样后显示模拟占比\" : \"Draw pairs to compare\";\n    } else {\n      var checkMode = mode === \"none\" ? \"gt\" : mode;\n      var cnt = 0;\n      for(var i=0;i\u003cN;i++) if(inTail(state.reps[i].diff, c, checkMode, th.mu)) cnt++;\n      $(\"pEmpVal\").textContent = (cnt / N * 100).toFixed(1) + \"%\";\n      $(\"pEmpSub\").textContent = cnt.toLocaleString() + \" / \" + N.toLocaleString();\n    }\n  }\n\n  function drawChart(){\n    var canvas = $(\"chart\"), wrap = canvas.parentElement;\n    var W = wrap.clientWidth, H = canvas.clientHeight || 330;\n    var dpr = window.devicePixelRatio || 1;\n    canvas.width = Math.round(W * dpr);\n    canvas.height = Math.round(H * dpr);\n    var ctx = canvas.getContext(\"2d\");\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    ctx.clearRect(0, 0, W, H);\n\n    var th = theory(), reps = state.reps, N = reps.length;\n    var diffs = []; for(var i=0;i\u003cN;i++) diffs.push(reps[i].diff);\n    var mm = arrMinMax(diffs);\n    var lo = Math.max(-1, th.mu - 4.2 * th.se), hi = Math.min(1, th.mu + 4.2 * th.se);\n    if(N > 0){ lo = Math.min(lo, mm[0]); hi = Math.max(hi, mm[1]); }\n    var span = hi - lo;\n    if(span \u003c 0.1){ var mid = (lo + hi) / 2; lo = clamp(mid - 0.05, -1, 0.9); hi = clamp(lo + 0.1, -0.9, 1); span = hi - lo; }\n    lo = Math.max(-1, lo - span * 0.04); hi = Math.min(1, hi + span * 0.04);\n\n    // Binning: discrete-aligned when n1 === n2, adaptive otherwise\n    var bins, bw, counts, kMin = 0, g = 1, discreteAligned = (state.n1 === state.n2);\n    if(discreteAligned){\n      var n = state.n1;\n      kMin = Math.max(-n, Math.floor(lo * n));\n      var kMax = Math.min(n, Math.ceil(hi * n));\n      var kSpan = Math.max(1, kMax - kMin + 1);\n      g = Math.max(1, Math.ceil(kSpan / 32));\n      bins = Math.ceil(kSpan / g);\n      bw = g / n;\n      lo = Math.max(-1, (kMin - 0.5) / n);\n      hi = Math.min(1, (kMin + bins * g - 0.5) / n);\n      counts = new Array(bins).fill(0);\n      for(i=0;i\u003cN;i++){\n        var k = reps[i].x1 - reps[i].x2;\n        var idx = Math.floor((k - kMin) / g);\n        if(idx \u003c 0) idx = 0; if(idx >= bins) idx = bins - 1;\n        counts[idx]++;\n      }\n    } else {\n      bins = Math.min(34, Math.max(12, Math.round(Math.sqrt(Math.max(N, 120)) * 1.4)));\n      if(Math.min(state.n1, state.n2) \u003c 15) bins = Math.min(bins, Math.max(12, Math.min(state.n1, state.n2) * 2));\n      bw = (hi - lo) / bins;\n      counts = new Array(bins).fill(0);\n      for(i=0;i\u003cN;i++){\n        var bIdx = Math.floor((reps[i].diff
