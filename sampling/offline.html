rgin-top:8px}\n.n-presets button{min-height:30px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}\n.n-presets button.active{background:var(--navy);color:#fff;border-color:var(--navy)}\n\n.toggles{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}\n.toggles label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}\n.toggles input{width:16px;height:16px;accent-color:var(--sage);cursor:pointer}\n\n.action-bar{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 15px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;box-shadow:var(--shadow-sm)}\n.btn:hover{border-color:var(--navy)}\n.btn:active{transform:translateY(1px)}\n.btn.primary{background:var(--sage);color:#fff;border-color:var(--sage)}\n.btn.reset{color:var(--danger)}\n.btn:disabled{opacity:.45;cursor:default;transform:none}\n.spacer{flex:1}\n.rep-badge{font-size:13.5px;color:var(--ink-2)}\n.rep-badge b{font-family:var(--mono);font-size:16px;color:var(--ink)}\n\n.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}\n@media(max-width:860px){.charts-grid{grid-template-columns:1fr}}\n.chart-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}\n.chart-head h2{margin:0}\n.legend{display:flex;gap:10px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}\n.legend span{display:inline-flex;align-items:center;gap:4px}\n.swatch{display:inline-block;width:11px;height:11px;border-radius:3px}\n.swatch-line{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--accent)}\n.swatch-dash{display:inline-block;width:14px;height:0;border-top:2px dashed var(--danger)}\ncanvas{width:100%;height:260px;display:block}\n.empty-note{text-align:center;color:var(--ink-2);font-size:13px;padding:8px 10px;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;margin-top:6px}\n\n.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}\n@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}\n.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-sm)}\n.stat .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}\n.stat .v{font-family:var(--mono);font-size:23px;font-weight:800;line-height:1.2;margin-top:3px}\n.stat .s{font-size:12px;color:var(--ink-2);margin-top:2px}\n.stat.highlight{border-color:var(--sage);background:var(--sage-soft)}\n.stat.highlight .v{color:var(--sage)}\n\n.prob-card{margin-top:14px}\n.prob-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}\n.prob-input-wrap{display:flex;align-items:center;gap:8px}\n.prob-input-wrap label{font-size:13.5px;font-weight:700}\n.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}\n.seg button{min-height:32px;padding:0 12px;border:0;border-radius:999px;background:transparent;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:#fff}\n.prob-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}\n@media(max-width:640px){.prob-grid{grid-template-columns:1fr}}\n.pbox{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}\n.pbox .pk{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}\n.pbox .pv{font:800 20px/1.25 var(--mono);margin-top:3px}\n.pbox .ps{font-size:12px;color:var(--ink-2);margin-top:2px}\n.prob-warn{margin-top:8px;font-size:12.5px;color:#92400E;background:var(--gold-soft);padding:6px 10px;border-radius:8px}\n\n.sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}\n@media(max-width:860px){.sub-grid{grid-template-columns:1fr}}\n\ntable.check-tbl{width:100%;border-collapse:collapse;font-size:13.5px}\ntable.check-tbl th,table.check-tbl td{padding:7px 5px;border-bottom:1px solid var(--line-soft);text-align:right}\ntable.check-tbl th:first-child,table.check-tbl td:first-child{text-align:left}\ntable.check-tbl th{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}\ntable.check-tbl td.mono{font-family:var(--mono);font-weight:600}\ntable.check-tbl tr:last-child td{border-bottom:none}\n\n.insight{background:var(--gold-soft);border:1px solid rgba(180,83,9,.28);border-radius:var(--r-md);padding:15px 18px}\n.insight h3{margin:0 0 6px;font-size:15px;color:var(--ink)}\n.insight p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}\n\n.dots{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}\n.dot{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font:600 12.5px/1.3 var(--mono)}\n.dot.mean-dot{background:var(--sage);color:#fff;border-color:var(--sage)}\n\ndetails.extra{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 14px}\ndetails.extra summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--navy);min-height:28px;display:flex;align-items:center}\n.recent{font:12.5px/1.8 var(--mono);color:var(--ink-2);word-break:break-all;margin:6px 0}\n\nfooter{margin-top:18px;font-size:12.5px;color:var(--ink-3);text-align:center}\n.kbd{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 6px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cnav class=\"sim-nav\" aria-label=\"选择模拟器\">\n  \u003cdiv class=\"sim-nav-inner\">\n    \u003ca class=\"sim-back\" href=\"../homework.html\">← 返回 AP 统计\u003c/a>\n    \u003ca href=\"proportion.html\" data-i18n=\"nav_p\">样本比例 p̂\u003c/a>\n    \u003ca href=\"proportion-difference.html\" data-i18n=\"nav_pd\">两样本比例差 p̂₁ − p̂₂\u003c/a>\n    \u003cstrong aria-current=\"page\" data-i18n=\"nav_m\">样本均值 x̄\u003c/strong>\n    \u003ca href=\"mean-difference.html\" data-i18n=\"nav_md\">两样本均值差 x̄₁ − x̄₂\u003c/a>\n  \u003c/div>\n\u003c/nav>\n\n\u003cdiv class=\"wrap\">\n  \u003cheader class=\"top\">\n    \u003cdiv class=\"head-row\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">AP Statistics · Sampling Distribution · Central Limit Theorem\u003c/p>\n        \u003ch1 data-i18n-html=\"h1\">样本均值的抽样分布 \u003cem>x̄\u003c/em>\u003c/h1>\n        \u003cp class=\"sub\" data-i18n-html=\"sub\">切换总体形状与样本量 \u003cb>n\u003c/b>，反复抽取样本均值 \u003cb>x̄\u003c/b>，直观见证中心极限定理（CLT）与标准误规律。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"lang-switch\" role=\"group\" aria-label=\"Language toggle\">\n        \u003cbutton type=\"button\" id=\"langZh\" aria-pressed=\"true\">中文\u003c/button>\n        \u003cbutton type=\"button\" id=\"langEn\" aria-pressed=\"false\">EN\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula\">\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_mean\">中心\u003c/span>\u003cspan class=\"eq\">μ\u003csub>x̄\u003c/sub> = μ\u003c/span>\u003c/span>\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_sd\">标准误 (SE)\u003c/span>\u003cspan class=\"eq\">σ\u003csub>x̄\u003c/sub> = \u003cspan class=\"frac\">\u003cspan class=\"frac-num\">σ\u003c/span>\u003cspan class=\"frac-den\">\u003cmath>\u003cmsqrt>\u003cmi>n\u003c/mi>\u003c/msqrt>\u003c/math>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_shape\">正态条件\u003c/span>\u003cspan class=\"eq\" data-i18n=\"f_shape_v\">总体正态 或 n ≥ 30 (CLT)\u003c/span>\u003c/span>\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_ind\">独立性\u003c/span>\u003cspan class=\"eq\">n ≤ 10% · N\u003c/span>\u003c/span>\n    \u003c/div>\n\n    \u003cdetails class=\"guide-box\">\n      \u003csummary data-i18n=\"guide_title\">课堂练习引导（Worksheet Guide）\u003c/summary>\n      \u003cp data-i18n=\"guide_body\">第 3 页 A：选「右偏」总体，依次用 n = 4、16、64，每次抽 1,000 次，记录模拟均值和模拟 SD。第 4 页 B：勾选「比较形状时固定 μ = 50、σ = 10」，切换不同总体比较抽样分布形态。\u003c/p>\n    \u003c/details>\n  \u003c/header>\n\n  \u003cdiv class=\"controls-grid\">\n    \u003csection class=\"card\" aria-label=\"选择总体\">\n      \u003ch2 data-i18n=\"sec_pop\">1 · 选择总体分布\u003c/h2>\n      \u003cdiv class=\"pills\" id=\"popPills\" role=\"group\" aria-label=\"总体形状\">\n        \u003cbutton type=\"button\" class=\"pill\" data-pop=\"normal\" aria-pressed=\"true\">\u003cspan data-i18n=\"p_norm\">正态 Normal\u003c/span>\u003csmall data-i18n=\"p_norm_s\">钟形 · 对称\u003c/small>\u003c/button>\n        \u003cbutton type=\"button\" class=\"pill\" data-pop=\"uniform\">\u003cspan data-i18n=\"p_unif\">均匀 Uniform\u003c/span>\u003csmall data-i18n=\"p_unif_s\">平坦 · 对称\u003c/small>\u003c/button>\n        \u003cbutton type=\"button\" class=\"pill\" data-pop=\"right\">\u003cspan data-i18n=\"p_right\">右偏 Right\u003c/span>\u003csmall data-i18n=\"p_right_s\">长尾在右\u003c/small>\u003c/button>\n        \u003cbutton type=\"button\" class=\"pill\" data-pop=\"left\">\u003cspan data-i18n=\"p_left\">左偏 Left\u003c/span>\u003csmall data-i18n=\"p_left_s\">长尾在左\u003c/small>\u003c/button>\n        \u003cbutton type=\"button\" class=\"pill\" data-pop=\"bimodal\">\u003cspan data-i18n=\"p_bi\">双峰 Bimodal\u003c/span>\u003csmall data-i18n=\"p_bi_s\">两个峰\u003c/small>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"pop-meta\">\n        \u003cdiv>\u003cspan data-i18n=\"pm_mu\">总体均值 μ\u003c/span>\u003cb id=\"popMu\">50.0\u003c/b>\u003c/div>\n        \u003cdiv>\u003cspan data-i18n=\"pm_sd\">总体标准差 σ\u003c/span>\u003cb id=\"popSigma\">10.0\u003c/b>\u003c/div>\n        \u003cdiv>\u003cspan data-i18n=\"pm_sh\">总体形状\u003c/span>\u003cb id=\"popShape\">对称\u003c/b>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"card\" aria-label=\"样本量\">\n      \u003ch2 data-i18n=\"sec_n\">2 · 样本量 n 与视图选项\u003c/h2>\n      \u003cdiv class=\"n-row\">\n        \u003cspan class=\"mono\" style=\"font-weight:700\">n =\u003c/span>\n        \u003cinput type=\"number\" class=\"num-input\" id=\"nNum\" min=\"1\" max=\"200\" step=\"1\" value=\"10\" aria-label=\"样本量 n\">\n        \u003cinput type=\"range\" id=\"nSlider\" min=\"1\" max=\"100\" step=\"1\" value=\"10\" aria-label=\"样本量滑块\">\n      \u003c/div>\n      \u003cdiv class=\"n-presets\" id=\"nPresets\">\u003c/div>\n      \u003cdiv class=\"toggles\">\n        \u003clabel>\u003cinput type=\"checkbox\" id=\"fixedMoments\">\u003cspan data-i18n=\"tog_fix\">固定 μ = 50、σ = 10 仅比形状\u003c/span>\u003c/label>\n        \u003clabel>\u003cinput type=\"checkbox\" id=\"chkCurve\" checked>\u003cspan data-i18n=\"tog_curve\">显示理论正态曲线\u003c/span>\u003c/label>\n        \u003clabel>\u003cinput type=\"checkbox\" id=\"chkMean\" checked>\u003cspan data-i18n=\"tog_mean\">显示模拟均值线\u003c/span>\u003c/label>\n        \u003clabel>\u003cinput type=\"checkbox\" id=\"chkLast\" checked>\u003cspan data-i18n=\"tog_last\">显示最近一次样本\u003c/span>\u003c/label>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cdiv class=\"action-bar\" role=\"group\" aria-label=\"抽样控制\">\n    \u003cbutton type=\"button\" class=\"btn primary\" id=\"draw1\" data-i18n=\"btn_1\">抽 1 次样本\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"draw10\">+ 10\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"draw100\">+ 100\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"draw1000\">+ 1,000\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn reset\" id=\"resetBtn\" data-i18n=\"btn_reset\">Reset 清空\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"csvBtn\" disabled data-i18n=\"btn_csv\">导出 CSV\u003c/button>\n    \u003cdiv class=\"spacer\">\u003c/div>\n    \u003cspan class=\"rep-badge\">\u003cspan data-i18n=\"rep_pre\">已收集\u003c/span> \u003cb id=\"repCount\">0\u003c/b> \u003cspan data-i18n=\"rep_suf\">个 x̄\u003c/span>\u003c/span>\n  \u003c/div>\n\n  \u003cdiv class=\"charts-grid\">\n    \u003csection class=\"card\">\n      \u003cdiv class=\"chart-head\">\n        \u003ch2 data-i18n=\"pop_chart_t\">总体分布 · POPULATION\u003c/h2>\n        \u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"swatch\" style=\"background:var(--navy)\">\u003c/i>\u003cspan data-i18n=\"leg_pop\">总体个体\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003ccanvas id=\"popChart\" width=\"520\" height=\"260\">\u003c/canvas>\n    \u003c/section>\n\n    \u003csection class=\"card\">\n      \u003cdiv class=\"chart-head\">\n        \u003ch2 data-i18n=\"samp_chart_t\">x̄ 抽样分布 · DISTRIBUTION OF x̄\u003c/h2>\n        \u003cdiv class=\"legend\">\n          \u003cspan>\u003ci class=\"swatch\" style=\"background:var(--sage)\">\u003c/i>\u003cspan>x̄\u003c/span>\u003c/span>\n          \u003cspan>\u003ci class=\"swatch\" style=\"background:var(--accent)\">\u003c/i>\u003cspan data-i18n=\"leg_tail\">尾部\u003c/span>\u003c/span>\n          \u003cspan>\u003ci class=\"swatch-line\">\u003c/i>\u003cspan data-i18n=\"leg_curve\">正态曲线\u003c/span>\u003c/span>\n          \u003cspan>\u003ci class=\"swatch-dash\">\u003c/i>\u003cspan data-i18n=\"leg_mean\">模拟均值\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003ccanvas id=\"sampChart\" width=\"520\" height=\"260\">\u003c/canvas>\n      \u003cdiv class=\"empty-note\" id=\"emptyNote\">\u003c/div>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cdiv class=\"stats\">\n    \u003cdiv class=\"stat\">\u003cdiv class=\"k\" data-i18n=\"st_thmu\">理论中心 μ\u003csub>x̄\u003c/sub>\u003c/div>\u003cdiv class=\"v\" id=\"thMu\">50.00\u003c/div>\u003cdiv class=\"s\" data-i18n=\"st_thmu_s\">= 总体 μ（无偏）\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat highlight\">\u003cdiv class=\"k\" data-i18n=\"st_smu\">模拟中心 · x̄ 的均值\u003c/div>\u003cdiv class=\"v\" id=\"simMu\">—\u003c/div>\u003cdiv class=\"s\" id=\"simMuD\">—\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cdiv class=\"k\" data-i18n=\"st_thse\">理论标准误 σ/√n\u003c/div>\u003cdiv class=\"v\" id=\"thSE\">3.16\u003c/div>\u003cdiv class=\"s\" id=\"thSED\">—\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat highlight\">\u003cdiv class=\"k\" data-i18n=\"st_ssd\">模拟标准差 SD\u003c/div>\u003cdiv class=\"v\" id=\"simSD\">—\u003c/div>\u003cdiv class=\"s\" id=\"simSDD\">—\u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003csection class=\"card prob-card\">\n    \u003cdiv class=\"prob-controls\">\n      \u003ch2 style=\"margin:0\" data-i18n=\"prob_title\">概率探索器与尾部高亮\u003c/h2>\n      \u003cdiv class=\"prob-input-wrap\">\n        \u003clabel for=\"cutoff\" data-i18n=\"prob_cut\">临界值 c\u003c/label>\n        \u003cinput type=\"number\" class=\"num-input\" id=\"cutoff\" step=\"0.5\" value=\"53\" style=\"font-size:15px;min-height:36px\">\n      \u003c/div>\n      \u003cdiv class=\"seg\" role=\"group\" aria-label=\"尾部高亮模式\">\n        \u003cbutton type=\"button\" data-tail=\"none\" aria-pressed=\"true\" data-i18n=\"tail_none\">无高亮\u003c/button>\n        \u003cbutton type=\"button\" data-tail=\"gt\" aria-pressed=\"false\">&gt; c\u003c/button>\n        \u003cbutton type=\"button\" data-tail=\"lt\" aria-pressed=\"false\">&lt; c\u003c/button>\n        \u003cbutton type=\"button\" data-tail=\"two\" aria-pressed=\"false\" data-i18n=\"tail_two\">双尾\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"prob-grid\">\n      \u003cdiv class=\"pbox\">\u003cdiv class=\"pk\" id=\"pEmpLbl\">P(x̄ &gt; 53.0)\u003c/div>\u003cdiv class=\"pv\" id=\"pEmpVal\">—\u003c/div>\u003cdiv class=\"ps\" id=\"pEmpSub\">—\u003c/div>\u003c/div>\n      \u003cdiv class=\"pbox\">\u003cdiv class=\"pk\" data-i18n=\"prob_model\">理论正态近似\u003c/div>\u003cdiv class=\"pv\" id=\"pTheoVal\">—\u003c/div>\u003cdiv class=\"ps\" id=\"pTheoSub\">—\u003c/div>\u003c/div>\n      \u003cdiv class=\"pbox\">\u003cdiv class=\"pk\" data-i18n=\"prob_z\">标准化 z-score\u003c/div>\u003cdiv class=\"pv\" id=\"pZVal\">—\u003c/div>\u003cdiv class=\"ps\">z = (c − μ) / (σ/√n)\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"prob-warn\" id=\"probWarn\" hidden data-i18n=\"prob_warn\">⚠ 当前总体非正态且 n &lt; 30，理论正态模型仅作参考。\u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"sub-grid\">\n    \u003csection class=\"card\">\n      \u003ch2 data-i18n=\"sec_check\">理论 vs 模拟检验\u003c/h2>\n      \u003ctable class=\"check-tbl\">\n        \u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth data-i18n=\"tbl_th\">理论值\u003c/th>\u003cth data-i18n=\"tbl_sim\">模拟值\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd data-i18n=\"row_mean\">中心（均值）\u003c/td>\u003ctd class=\"mono\" id=\"tMu\">—\u003c/td>\u003ctd class=\"mono\" id=\"sMu\">—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd data-i18n=\"row_sd\">离散度（SE）\u003c/td>\u003ctd class=\"mono\" id=\"tSD\">—\u003c/td>\u003ctd class=\"mono\" id=\"sSD\">—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>±1·SE\u003c/td>\u003ctd class=\"mono\">≈ 68%\u003c/td>\u003ctd class=\"mono\" id=\"sW1\">—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>±2·SE\u003c/td>\u003ctd class=\"mono\">≈ 95%\u003c/td>\u003ctd class=\"mono\" id=\"sW2\">—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>±3·SE\u003c/td>\u003ctd class=\"mono\">≈ 99.7%\u003c/td>\u003ctd class=\"mono\" id=\"sW3\">—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd data-i18n=\"row_skew\">偏度 skewness\u003c/td>\u003ctd class=\"mono\">0\u003c/td>\u003ctd class=\"mono\" id=\"sSkew\">—\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/section>\n\n    \u003csection class=\"insight\" aria-live=\"polite\">\n      \u003ch3 id=\"insightTitle\">\u003c/h3>\n      \u003cp id=\"insightText\">\u003c/p>\n    \u003c/section>\n  \u003c/div>\n\n  \u003csection class=\"card\" id=\"lastSection\" style=\"margin-top:14px\">\n    \u003ch2 data-i18n=\"sec_last\">最近一次样本（单次样本 ≠ 抽样分布）\u003c/h2>\n    \u003cdiv id=\"lastBody\">\u003c/div>\n  \u003c/section>\n\n  \u003cdetails class=\"extra\">\n    \u003csummary data-i18n=\"recent_title\">查看最近 120 个样本均值 x̄\u003c/summary>\n    \u003cp class=\"recent\" id=\"recentList\">—\u003c/p>\n  \u003c/details>\n\n  \u003cfooter>\n    \u003cspan data-i18n=\"foot\">修改总体或 n 会清空已收集的 x̄；按\u003c/span> \u003cspan class=\"kbd\">Space\u003c/span> \u003cspan data-i18n=\"foot2\">快速抽 1 次。\u003c/span>\n  \u003c/footer>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n  var $ = function(id){ return document.getElementById(id); };\n  var N_STEPS = [2,4,5,10,16,20,30,40,50,64,100];\n  var state = { pop:\"normal\", n:10, fixed:false, means:[], lastSample:null, lastMean:null, popVals:[], tail:\"none\", lang:\"zh\", cutoffTouched:false };\n\n  function randNormal(mu, sig){\n    var u=0,v=0; while(u===0) u=Math.random(); while(v===0) v=Math.random();\n    return mu + sig * Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);\n  }\n  function randExp(mean){ return -mean * Math.log(1 - Math.random()); }\n\n  var POPS = {\n    normal:  { mu:50, sigma:10, zh:\"对称 · 钟形\", en:\"Symmetric · Bell\", gen:function(){ return randNormal(50,10); } },\n    uniform: { mu:50, sigma:100/Math.sqrt(12), zh:\"平坦 · 对称\", en:\"Flat · Symmetric\", gen:function(){ return Math.random()*100; } },\n    right:   { mu:30, sigma:30, zh:\"右偏 · 长尾在右\", en:\"Skewed Right\", gen:function(){ return randExp(30); } },\n    left:    { mu:70, sigma:30, zh:\"左偏 · 长尾在左\", en:\"Skewed Left\", gen:function(){ return 100 - randExp(30); } },\n    bimodal: { mu:50, sigma:Math.sqrt(548), zh:\"双峰 · 对称\", en:\"Bimodal · Symmetric\", gen:function(){ return Math.random()\u003c0.5 ? randNormal(28,8) : randNormal(72,8); } }\n  };\n\n  var I18N = {\n    zh:{\n      nav_p:\"样本比例 p̂\", nav_pd:\"两样本比例差 p̂₁ − p̂₂\", nav_m:\"样本均值 x̄\", nav_md:\"两样本均值差 x̄₁ − x̄₂\",\n      h1:\"样本均值的抽样分布 \u003cem>x̄\u003c/em>\",\n      sub:\"切换总体形状与样本量 \u003cb>n\u003c/b>，反复抽取样本均值 \u003cb>x̄\u003c/b>，直观见证中心极限定理（CLT）与标准误规律。\",\n      f_mean:\"中心\", f_sd:\"标准误 (SE)\", f_shape:\"正态条件\", f_shape_v:\"总体正态 或 n ≥ 30 (CLT)\", f_ind:\"独立性\",\n      guide_title:\"课堂练习引导（Worksheet Guide）\",\n      guide_body:\"第 3 页 A：选「右偏」总体，依次用 n = 4、16、64，每次抽 1,000 次，记录模拟均值和模拟 SD。第 4 页 B：勾选「固定 μ = 50、σ = 10 仅比形状」，切换不同总体比较抽样分布形态。\",\n      sec_pop:\"1 · 选择总体分布\", p_norm:\"正态 Normal\", p_norm_s:\"钟形 · 对称\", p_unif:\"均匀 Uniform\", p_unif_s:\"平坦 · 对称\",\n      p_right:\"右偏 Right\", p_right_s:\"长尾在右\", p_left:\"左偏 Left\", p_left_s:\"长尾在左\", p_bi:\"双峰 Bimodal\", p_bi_s:\"两个峰\",\n      pm_mu:\"总体均值 μ\", pm_sd:\"总体标准差 σ\", pm_sh:\"总体形状\",\n      sec_n:\"2 · 样本量 n 与视图选项\",\n      tog_fix:\"固定 μ = 50、σ = 10 仅比形状\", tog_curve:\"显示理论正态曲线\", tog_mean:\"显示模拟均值线\", tog_last:\"显示最近一次样本\",\n      btn_1:\"抽 1 次样本\", btn_reset:\"Reset 清空\", btn_csv:\"导出 CSV\", rep_pre:\"已收集\", rep_suf:\"个 x̄\",\n      pop_chart_t:\"总体分布 · POPULATION\", leg_pop:\"总体个体（8,000 点）\",\n      samp_chart_t:\"x̄ 抽样分布 · DISTRIBUTION OF x̄\", leg_tail:\"尾部\", leg_curve:\"正态曲线\", leg_mean:\"模拟均值\",\n      st_thmu:\"理论中心 μ\u003csub>x̄\u003c/sub>\", st_thmu_s:\"= 总体 μ（无偏）\", st_smu:\"模拟中心 · x̄ 的均值\", st_thse:\"理论标准误 σ/√n\", st_ssd:\"模拟标准差 SD\",\n      prob_title:\"概率探索器与尾部高亮\", prob_cut:\"临界值 c\", tail_none:\"无高亮\", tail_two:\"双尾\",\n      prob_model:\"理论正态近似\", prob_z:\"标准化 z-score\",\n      prob_warn:\"⚠ 当前总体非正态且 n \u003c 30，理论正态模型仅作参考。\",\n      sec_check:\"理论 vs 模拟检验\", tbl_th:\"理论值\", tbl_sim:\"模拟值\", row_mean:\"中心（均值）\", row_sd:\"离散度（SE）\", row_skew:\"偏度 skewness\",\n      sec_last:\"最近一次样本（单次样本 ≠ 抽样分布）\", recent_title:\"查看最近 120 个样本均值 x̄\",\n      foot:\"修改总体或 n 会清空已收集的 x̄；按\", foot2:\"快速抽 1 次。\",\n      empty:\"还没有 x̄ — 点击「抽 1 次样本」或「+ 1,000」开始。\",\n      last_empty:\"尚未抽样。点击抽样后这里会展示该次抽到的 n 个具体数值及其均值 x̄。\"\n    },\n    en:{\n      nav_p:\"Sample Proportion p̂\", nav_pd:\"Diff of Proportions p̂₁ − p̂₂\", nav_m:\"Sample Mean x̄\", nav_md:\"Diff of Means x̄₁ − x̄₂\",\n      h1:\"Sampling Distribution of \u003cem>x̄\u003c/em>\",\n      sub:\"Pick a population shape and sample size \u003cb>n\u003c/b>, draw repeated sample means \u003cb>x̄\u003c/b>, and watch the Central Limit Theorem unfold.\",\n      f_mean:\"Center\", f_sd:\"Spread (SE)\", f_shape:\"Shape ≈ Normal\", f_shape_v:\"Normal pop OR n ≥ 30 (CLT)\", f_ind:\"Independence\",\n      guide_title:\"Classroom Worksheet Guide\",\n      guide_body:\"Page 3 A: Choose Right-skewed population and run n = 4, 16, 64 (1,000 draws each) to record mean & SD. Page 4 B: Check 'Fix μ = 50, σ = 10' to compare shapes cleanly.\",\n      sec_pop:\"1 · Population Distribution\", p_norm:\"Normal\", p_norm_s:\"Bell-shaped\", p_unif:\"Uniform\", p_unif_s:\"Flat · Symmetric\",\n      p_right:\"Right-skewed\", p_right_s:\"Long right tail\", p_left:\"Left-skewed\", p_left_s:\"Long left tail\", p_bi:\"Bimodal\", p_bi_s:\"Two peaks\",\n      pm_mu:\"Population μ\", pm_sd:\"Population σ\", pm_sh:\"Shape\",\n      sec_n:\"2 · Sample Size n & Options\",\n      tog_fix:\"Fix μ = 50, σ = 10 (shape only)\", tog_curve:\"Show Normal curve\", tog_mean:\"Show simulated mean\", tog_last:\"Show last sample\",\n      btn_1:\"Draw 1 Sample\", btn_reset:\"Reset\", btn_csv:\"Download CSV\", rep_pre:\"Collected\", rep_suf:\"x̄ values\",\n      pop_chart_t:\"Population Distribution\", leg_pop:\"Population (8,000 draws)\",\n      samp_chart_t:\"Sampling Distribution of x̄\", leg_tail:\"Shaded tail\", leg_curve:\"Normal curve\", leg_mean:\"Simulated mean\",\n      st_thmu:\"Theoretical Center μ\u003csub>x̄\u003c/sub>\", st_thmu_s:\"= Population μ (unbiased)\", st_smu:\"Simulated Mean of x̄\", st_thse:\"Theoretical SE σ/√n\", st_ssd:\"Simulated SD of x̄\",\n      prob_title:\"Probability Explorer & Tail Shading\", prob_cut:\"Cutoff c\", tail_none:\"None\", tail_two:\"Two-tail\",\n      prob_model:\"Normal Model\", prob_z:\"z-score\",\n      prob_warn:\"⚠ Population is non-Normal and n \u003c 30; the Normal approximation may be skewed.\",\n      sec_check:\"Theory vs. Simulation\", tbl_th:\"Theory\", tbl_sim:\"Simulated\", row_mean:\"Center (Mean)\", row_sd:\"Spread (SE)\", row_skew:\"Skewness\",\n      sec_last:\"Most Recent Sample (One sample ≠ Sampling distribution)\", recent_title:\"View Last 120 Sample Means (x̄)\",\n      foot:\"Changing population or n clears collected x̄ values; press\", foot2:\"to draw 1.\",\n      empty:\"No x̄ values yet — click Draw 1 Sample or + 1,000 to begin.\",\n      last_empty:\"No draws yet. Each draw displays the n sampled observations and their mean x̄.\"\n    }\n  };\n\n  function t(k){ return (I18N[state.lang] && I18N[state.lang][k]) || I18N.zh[k] || k; }\n  function clamp(v,lo,hi){ return Math.min(hi, Math.max(lo, v)); }\n  function fmt(x,d){ return (x===null||x===undefined||isNaN(x)) ? \"—\" : Number(x).toFixed(d===undefined?2:d); }\n  function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }\n  function arrMinMax(arr){\n    if(!arr.length) return [0,0];\n    var mn=arr[0], mx=arr[0];\n    for(var i=1;i\u003carr.length;i++){ if(arr[i]\u003cmn) mn=arr[i]; if(arr[i]>mx) mx=arr[i]; }\n    return [mn,mx];\n  }\n  function normalPDF(x,mu,sd){ var z=(x-mu)/sd; return Math.exp(-0.5*z*z)/(sd*Math.sqrt(2*Math.PI)); }\n  function normalCDF(z){\n    var a=Math.abs(z), p=1/(1+0.2316419*a);\n    var poly=p*(0.319381530+p*(-0.356563782+p*(1.781477937+p*(-1.821255978+p*1.330274429))));\n    var c=1-Math.exp(-0.5*a*a)/Math.sqrt(2*Math.PI)*poly;\n    return z>=0 ? c : 1-c;\n  }\n\n  function pop(){\n    var base = POPS[state.pop];\n    if(!state.fixed) return base;\n    return { mu:50, sigma:10, zh:base.zh, en:base.en, gen:function(){ return 50 + 10*(base.gen()-base.mu)/base.sigma; } };\n  }\n  function SE(){ return pop().sigma / Math.sqrt(state.n); }\n  function inTail(val, c, mode, mu){\n    if(mode===\"gt\") return val > c;\n    if(mode===\"lt\") return val \u003c c;\n    if(mode===\"two\") return Math.abs(val-mu) >= Math.abs(c-mu) - 1e-12;\n    return false;\n  }\n\n  function genPopVals(){\n    var p = pop(), arr = [];\n    for(var i=0;i\u003c8000;i++) arr.push(p.gen());\n    state.popVals = arr;\n  }\n\n  function popDisplayBounds(p){\n    if(state.pop === \"right\") return [p.mu - 1.3 * p.sigma, p.mu + 4.8 * p.sigma];\n    if(state.pop === \"left\")  return [p.mu - 4.8 * p.sigma, p.mu + 1.3 * p.sigma];\n    if(state.pop === \"uniform\"){ var half = p.sigma * Math.sqrt(3); return [p.mu - half*1.12, p.mu + half*1.12]; }\n    return [p.mu - 3.6 * p.sigma, p.mu + 3.6 * p.sigma];\n  }\n\n  function applyLang(){\n    document.documentElement.lang = state.lang === \"zh\" ? \"zh-CN\" : \"en\";\n    $(\"langZh\").setAttribute(\"aria-pressed\", String(state.lang===\"zh\"));\n    $(\"langEn\").setAttribute(\"aria-pressed\", String(state.lang===\"en\"));\n    document.querySelectorAll(\"[data-i18n]\").forEach(function(el){ el.textContent = t(el.dataset.i18n); });\n    document.querySelectorAll(\"[data-i18n-html]\").forEach(function(el){ el.innerHTML = t(el.dataset.i18nHtml); });\n    render();\n  }\n\n  function drawPopChart(){\n    var cv = $(\"popChart\"), wrap = cv.parentElement;\n    var W = wrap.clientWidth, H = cv.clientHeight || 260, dpr = window.devicePixelRatio || 1;\n    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);\n    var ctx = cv.getContext(\"2d\"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);\n\n    var p = pop(), bnds = popDisplayBounds(p), lo = bnds[0], hi = bnds[1];\n    var bins = 26, bw = (hi - lo) / bins, counts = new Array(bins).fill(0);\n    // Skip extreme outliers outside display bounds so edge bins never show artificial spikes\n    for(var i=0;i\u003cstate.popVals.length;i++){\n      var idx = Math.floor((state.popVals[i] - lo) / bw);\n      if(idx >= 0 && idx \u003c bins) counts[idx]++;\n    }\n    var maxC = 1; for(i=0;i\u003cbins;i++) if(counts[i]>maxC) maxC=counts[i];\n    var yMax = maxC * 1.12;\n    var padL = 40, padR = 12, padT = 14, padB = 30, cw = W - padL - padR, ch = H - padT - padB;\n    function X(v){ return padL + (v - lo) / (hi - lo) * cw; }\n    function Y(c){ return padT + ch - (c / yMax) * ch; }\n\n    var navy = cssVar(\"--navy\"), muted = cssVar(\"--ink-3\"), line = cssVar(\"--line\"), accent = cssVar(\"--accent\");\n    ctx.font = \"11px ui-monospace, Menlo, monospace\"; ctx.lineWidth = 1;\n    for(var s=0;s\u003c=3;s++){\n      var cval = (yMax / 1.12) * s / 3, yy = Y(cval);\n      ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(W-padR,yy); ctx.stroke();\n      ctx.fillStyle = muted; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\";\n      ctx.fillText(Math.round(cval).toString(), padL-6, yy);\n    }\n\n    ctx.fillStyle = navy; ctx.globalAlpha = 0.82;\n    for(var b=0;b\u003cbins;b++){\n      if(!counts[b]) continue;\n      var x0 = X(lo + b*bw) + 0.6, x1 = X(lo + (b+1)*bw) - 0.6;\n      ctx.fillRect(x0, Y(counts[b]), Math.max(2, x1 - x0), (counts[b]/yMax)*ch);\n    }\n    ctx.globalAlpha = 1;\n\n    var mx = X(p.mu);\n    ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.setLineDash([4,3]);\n    ctx.beginPath(); ctx.moveTo(mx, padT); ctx.lineTo(mx, Y(0)); ctx.stroke(); ctx.setLineDash([]);\n\n    ctx.strokeStyle = muted; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(padL, Y(0)); ctx.lineTo(W-padR, Y(0)); ctx.stroke();\n    ctx.fillStyle = muted; ctx.textAlign = \"center\"; ctx.textBaseline = \"top\";\n    for(var tk=0;tk\u003c=4;tk++){\n      var tv = lo + (hi - lo) * tk / 4;\n      ctx.fillText(tv.toFixed(0), X(tv), Y(0)+7);\n    }\n    ctx.fillStyle = accent; ctx.font = \"700 11px ui-monospace, Menlo, monospace\";\n    ctx.fillText(\"μ=\" + p.mu.toFixed(1), clamp(mx, padL+24, W-padR-24), Y(0)+19);\n  }\n\n  function drawSampChart(){\n    var cv = $(\"sampChart\"), wrap = cv.parentElement;\n    var W = wrap.clientWidth, H = cv.clientHeight || 260, dpr = window.devicePixelRatio || 1;\n    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);\n    var ctx r p = pop(), n = state.n;\n    for(var r=0;r\u003ck;r++){\n      var s = [], sum = 0;\n      for(var i=0;i\u003cn;i++){\n        var v = p.gen();\n        if(r === k - 1 && i \u003c 40) s.push(v);\n        sum += v;\n      }\n      var m = sum / n;\n      state.means.push(m);\n      if(r === k - 1){\n        state.lastSample = s;\n        state.lastMean = m;\n      }\n    }\n    render();\n  }\n\n  function resetMeans(){ state.means = []; state.lastSample = null; state.lastMean = null; render(); }\n\n  // Init presets & bind ALL listeners strictly once\n  var presetsEl = $(\"nPresets\");\n  N_STEPS.forEach(function(v){\n    var b = document.createElement(\"button\"); b.type = \"button\"; b.textContent = \"n=\" + v;\n    b.addEventListener(\"click\", function(){ if(state.n !== v){ state.n = v; resetMeans(); } });\n    presetsEl.appendChild(b);\n  });\n\n  document.querySelectorAll(\"#popPills .pill\").forEach(function(b){\n    b.addEventListener(\"click\", function(){\n      document.querySelectorAll(\"#popPills .pill\").forEach(function(x){ x.setAttribute(\"aria-pressed\", \"false\"); });\n      b.setAttribute(\"aria-pressed\", \"true\");\n      state.pop = b.dataset.pop;\n      genPopVals(); resetMeans();\n    });\n  });\n\n  $(\"nSlider\").addEventListener(\"input\", function(){\n    var v = parseInt(this.value, 10);\n    if(v !== state.n){ state.n = v; resetMeans(); }\n  });\n  $(\"nNum\").addEventListener(\"change\", function(){\n    var v = parseInt(this.value, 10);\n    v = isNaN(v) ? 10 : clamp(v, 1, 200);\n    if(v !== state.n){ state.n = v; resetMeans(); } else { this.value = state.n; }\n  });\n  $(\"fixedMoments\").addEventListener(\"change\", function(){\n    state.fixed = this.checked;\n    genPopVals(); resetMeans();\n  });\n  $(\"chkCurve\").addEventListener(\"change\", drawSampChart);\n  $(\"chkMean\").addEventListener(\"change\", drawSampChart);\n  $(\"chkLast\").addEventListener(\"change\", render);\n\n  $(\"draw1\").addEventListener(\"click\", func arTimeout(resizeT); resizeT = setTimeout(function(){ drawPopChart(); drawSampChart(); }, 100); });\n  if(window.matchMedia){\n    var mq = window.matchMedia(\"(prefers-color-scheme: dark)\");\n    if(mq.addEventListener) mq.addEventListener(\"change\", function(){ drawPopChart(); drawSampChart(); });\n  }\n\n  try { var saved = localStorage.getItem(\"mg-sampling-lang\"); if(saved === \"en\" || saved === \"zh\") state.lang = saved; } catch(e){}\n  genPopVals();\n  applyLang();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003clink rel=\"icon\" href=\"data:,\">\n\u003ctitle>两样本均值之差的抽样分布模拟器 · Difference of Sample Means\u003c/title>\n\u003cscript>\ntry { if (window.self !== window.top) document.documentElement.classList.add('in-embed'); }\ncatch (e) { document.documentElement.classList.add('in-embed'); }\n\u003c/script>\n\u003cstyle>\n:root{\n  --ground:#F7F8FA; --surface:#FFFFFF; --surface-2:#F0F1F4; --line:#D6D8DA; --line-soft:#E8EAED;\n  --navy:#1865F2; --navy-2:#1152CC; --navy-soft:#EBF3FF;\n  --ink:#21242C; --ink-2:#525760; --ink-3:#6E737D;\n  --sage:#008A6E; --sage-soft:#E6F7F2;\n  --accent:#C75000; --accent-soft:#FFF3E8;\n  --gold:#B45309; --gold-soft:#FEF3C7; --gold-bright:#D97706;\n  --danger:#C5221F; --danger-soft:#FEECEB;\n  --serif:Georgia,\"Times New Roman\",\"Songti SC\",serif;\n  --sans:\"Lato\",-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"PingFang SC\",\"Hiragino Sans GB\",\"Segoe UI\",\"Microsoft YaHei\",sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;\n  --shadow-sm:0 1px 3px rgba(33,36,44,.06);\n  --r-md:8px; --r-sm:6px;\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 ground:var(--surface-2);border:1px dashed var(--line);border-radius:10px;margin-top:8px}\n\n.prob-card{margin-top:14px}\n.prob-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}\n.prob-input-wrap{display:flex;align-items:center;gap:8px}\n.prob-input-wrap label{font-size:13.5px;font-weight:700}\n.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}\n.seg button{min-height:32px;padding:0 12px;border:0;border-radius:999px;background:transparent;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);color:#fff}\n.prob-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}\n@media(max-width:640px){.prob-grid{grid-template-columns:1fr}}\n.pbox{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}\n.pbox .pk{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}\n.pbox .pv{font:800 20px/1.25 var(--mono);margin-top:3px}\n.pbox .ps{font-size:12px;color:var(--ink-2);margin-top:2px}\n.prob-warn{margin-top:8px;font-size:12.5px;color:#92400E;background:var(--gold-soft);padding:6px 10px;border-radius:8px}\n\n.side{display:grid;gap:14px}\n.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;text-align:center}\n@media(max-width:500px){.flow{grid-template-columns:1fr}}\n.fbox{border-radius:10px;padding:10px 8px}\n.fbox.f1{background:var(--sage-soft);color:var(--sage)}\n.fbox.f2{background:var(--accent-soft);color:var(--accent)}\n.fbox.fd{background:var(--navy-soft);color:var(--navy)}\n.fbox .fl{font-size:11px;font-weight:700;text-transform:uppercase}\n.fbox .fv{font:800 18px/1.2 var(--mono);margin:2px 0}\n.fbox .fs{font-size:11px;opacity:.85}\n.recent{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}\n.rchip{font:600 11.5px/1.2 var(--mono);padding:3px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}\n\ntable.check-tbl{width:100%;border-collapse:collapse;font-size:13.5px}\ntable.check-tbl th,table.check-tbl td{padding:7px 5px;border-bottom:1px solid var(--line-soft);text-align:right}\ntable.check-tbl th:first-child,table.check-tbl td:first-child{text-align:left}\ntable.check-tbl th{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}\ntable.check-tbl td.mono{font-family:var(--mono);font-weight:600}\ntable.check-tbl tr:last-child td{border-bottom:none}\n.var-note{font-size:12.5px;color:var(--ink-2);margin:10px 0 0;line-height:1.5;background:var(--surface-2);padding:9px 11px;border-radius:9px}\n\n.presets-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}\n@media(max-width:860px){.presets-grid{grid-template-columns:1fr 1fr}}\n@media(max-width:520px){.presets-grid{grid-template-columns:1fr}}\n.preset-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm)}\n.preset-card strong{font-size:13.5px}\n.preset-card p{margin:0;font-size:12.5px;color:var(--ink-2);flex:1}\n.preset-card button{min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:700;cursor:pointer}\n.preset-card button:hover{border-color:var(--sage);color:var(--sage)}\n\nfooter{margin-top:18px;font-size:12.5px;color:var(--ink-3);text-align:center}\n.kbd{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 6px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cnav class=\"sim-nav\" aria-label=\"选择模拟器\">\n  \u003cdiv class=\"sim-nav-inner\">\n    \u003ca class=\"sim-back\" href=\"../homework.html\">← 返回 AP 统计\u003c/a>\n    \u003ca href=\"proportion.html\" data-i18n=\"nav_p\">样本比例 p̂\u003c/a>\n    \u003ca href=\"proportion-difference.html\" data-i18n=\"nav_pd\">两样本比例差 p̂₁ − p̂₂\u003c/a>\n    \u003ca href=\"mean.html\" data-i18n=\"nav_m\">样本均值 x̄\u003c/a>\n    \u003cstrong aria-current=\"page\" data-i18n=\"nav_md\">两样本均值差 x̄₁ − x̄₂\u003c/strong>\n  \u003c/div>\n\u003c/nav>\n\n\u003cdiv class=\"wrap\">\n  \u003cheader class=\"top\">\n    \u003cdiv class=\"head-row\">\n      \u003cdiv>\n        \u003cp class=\"kicker\">AP Statistics · Sampling Distribution · Two Means\u003c/p>\n        \u003ch1 data-i18n-html=\"h1\">两样本均值之差的抽样分布 \u003cem>x̄₁ − x̄₂\u003c/em>\u003c/h1>\n        \u003cp class=\"sub\" data-i18n-html=\"sub\">设定两个独立总体的分布形状、均值、标准差与样本量，每次抽取一对样本计算 \u003cb>x̄₁ − x̄₂\u003c/b>，对比中心、方差相加规律与 CLT 成立条件。\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"lang-switch\" role=\"group\" aria-label=\"Language toggle\">\n        \u003cbutton type=\"button\" id=\"langZh\" aria-pressed=\"true\">中文\u003c/button>\n        \u003cbutton type=\"button\" id=\"langEn\" aria-pressed=\"false\">EN\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"formula\">\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_mean\">中心\u003c/span>\u003cspan class=\"eq\">μ = μ₁ − μ₂ = \u003cb id=\"fMu\">5.00\u003c/b>\u003c/span>\u003c/span>\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_sd\">标准误 (SE)\u003c/span>\u003cspan class=\"eq\">σ = \u003cmath>\u003cmsqrt>\u003cmfrac>\u003cmsup>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmsup>\u003cmsub>\u003cmi>σ\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/msqrt>\u003c/math> = \u003cb id=\"fSE\">2.85\u003c/b>\u003c/span>\u003c/span>\n      \u003cspan class=\"chip\">\u003cspan class=\"chip-label\" data-i18n=\"f_cond\">正态条件\u003c/span>\u003cspan class=\"eq\" data-i18n=\"f_cond_v\">每组各自满足：总体正态 或 n ≥ 30\u003c/span>\u003c/span>\n    \u003c/div>\n\n    \u003cdetails class=\"guide-box\">\n      \u003csummary data-i18n=\"guide_title\">课堂练习引导（Worksheet Guide）\u003c/summary>\n      \u003cp data-i18n=\"guide_body\">第 4 页：先设置两组正态总体的 μ、σ 和 n，再抽 1,000 对。比较偏态时将两组都切至「右偏」，用下方一键预设快速比较 (n₁=5, n₂=50) 与 (n₁=50, n₂=50) 的形状差异。\u003c/p>\n    \u003c/details>\n  \u003c/header>\n\n  \u003cdiv class=\"setup\">\n    \u003csection class=\"card pop-card g1\" aria-label=\"Population 1\">\n      \u003cdiv class=\"pop-head\">\n        \u003ch3 data-i18n=\"pop1_t\">总体 1 · Population 1\u003c/h3>\n        \u003cspan class=\"tag\">Pop 1 · x̄₁\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"dist1\" data-i18n=\"lbl_dist\">总体形状\u003c/label>\u003c/div>\n        \u003cselect id=\"dist1\">\n          \u003coption value=\"normal\" selected data-i18n=\"opt_norm\">正态 Normal — 钟形对称\u003c/option>\n          \u003coption value=\"uniform\" data-i18n=\"opt_unif\">均匀 Uniform — 平坦对称\u003c/option>\n          \u003coption value=\"right\" data-i18n=\"opt_right\">右偏 Right-skewed — 长尾在右\u003c/option>\n          \u003coption value=\"left\" data-i18n=\"opt_left\">左偏 Left-skewed — 长尾在左\u003c/option>\n          \u003coption value=\"bimodal\" data-i18n=\"opt_bi\">双峰 Bimodal — 两个峰\u003c/option>\n        \u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"mu1\">μ₁\u003c/label>\u003cinput type=\"number\" class=\"num-input\" id=\"mu1Num\" min=\"-200\" max=\"200\" step=\"1\" value=\"70\">\u003c/div>\n        \u003cdiv class=\"range-row\">\u003cinput type=\"range\" id=\"mu1\" min=\"0\" max=\"100\" step=\"1\" value=\"70\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"sd1\">σ₁\u003c/label>\u003cinput type=\"number\" class=\"num-input\" id=\"sd1Num\" min=\"0.5\" max=\"100\" step=\"0.5\" value=\"10\">\u003c/div>\n        \u003cdiv class=\"range-row\">\u003cinput type=\"range\" id=\"sd1\" min=\"1\" max=\"30\" step=\"1\" value=\"10\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"n1\">n₁\u003c/label>\u003cinput type=\"number\" class=\"num-input\" id=\"n1Num\" min=\"2\" max=\"500\" step=\"1\" value=\"30\">\u003c/div>\n        \u003cdiv class=\"range-row\">\u003cinput type=\"range\" id=\"n1\" min=\"2\" max=\"100\" step=\"1\" value=\"30\">\u003c/div>\n      \u003c/div>\n      \u003ccanvas class=\"popCanvas\" id=\"popChart1\" width=\"460\" height=\"135\">\u003c/canvas>\n    \u003c/section>\n\n    \u003csection class=\"card pop-card g2\" aria-label=\"Population 2\">\n      \u003cdiv class=\"pop-head\">\n        \u003ch3 data-i18n=\"pop2_t\">总体 2 · Population 2\u003c/h3>\n        \u003cspan class=\"tag\">Pop 2 · x̄₂\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"dist2\" data-i18n=\"lbl_dist2\">总体形状\u003c/label>\u003c/div>\n        \u003cselect id=\"dist2\">\n          \u003coption value=\"normal\" selected data-i18n=\"opt_norm\">正态 Normal — 钟形对称\u003c/option>\n          \u003coption value=\"uniform\" data-i18n=\"opt_unif\">均匀 Uniform — 平坦对称\u003c/option>\n          \u003coption value=\"right\" data-i18n=\"opt_right\">右偏 Right-skewed — 长尾在右\u003c/option>\n          \u003coption value=\"left\" data-i18n=\"opt_left\">左偏 Left-skewed — 长尾在左\u003c/option>\n          \u003coption value=\"bimodal\" data-i18n=\"opt_bi\">双峰 Bimodal — 两个峰\u003c/option>\n        \u003c/select>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"mu2\">μ₂\u003c/label>\u003cinput type=\"number\" class=\"num-input\" id=\"mu2Num\" min=\"-200\" max=\"200\" step=\"1\" value=\"65\">\u003c/div>\n        \u003cdiv class=\"range-row\">\u003cinput type=\"range\" id=\"mu2\" min=\"0\" max=\"100\" step=\"1\" value=\"65\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"sd2\">σ₂\u003c/label>\u003cinput type=\"number\" class=\"num-input\" id=\"sd2Num\" min=\"0.5\" max=\"100\" step=\"0.5\" value=\"12\">\u003c/div>\n        \u003cdiv class=\"range-row\">\u003cinput type=\"range\" id=\"sd2\" min=\"1\" max=\"30\" step=\"1\" value=\"12\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ctl\">\n        \u003cdiv class=\"label-row\">\u003clabel for=\"n2\">n₂\u003c/label>\u003cinput type=\"number\" class=\"num-input\" id=\"n2Num\" min=\"2\" max=\"500\" step=\"1\" value=\"30\">\u003c/div>\n        \u003cdiv class=\"range-row\">\u003cinput type=\"range\" id=\"n2\" min=\"2\" max=\"100\" step=\"1\" value=\"30\">\u003c/div>\n      \u003c/div>\n      \u003ccanvas class=\"popCanvas\" id=\"popChart2\" width=\"460\" height=\"135\">\u003c/canvas>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cdiv class=\"cond-bar ok\" id=\"condBar\">\n    \u003cspan id=\"condText\">\u003c/span>\n    \u003clabel class=\"tog-pill\" style=\"background:var(--surface)\">\u003cinput type=\"checkbox\" id=\"chkSharedAxis\" checked>\u003cspan data-i18n=\"tog_shared\">同步两总体横轴刻度（直观对比中心偏移）\u003c/span>\u003c/label>\n  \u003c/div>\n\n  \u003cdiv class=\"action-bar\" role=\"group\" aria-label=\"抽样控制\">\n    \u003cbutton type=\"button\" class=\"btn primary\" id=\"draw1\" data-i18n=\"btn_1\">抽 1 对样本\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"draw10\">+ 10\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"draw100\">+ 100\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"draw1000\">+ 1,000\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn reset\" id=\"resetBtn\" data-i18n=\"btn_reset\">Reset 清空\u003c/button>\n    \u003cbutton type=\"button\" class=\"btn\" id=\"csvBtn\" disabled data-i18n=\"btn_csv\">导出 CSV\u003c/button>\n    \u003cdiv class=\"spacer\">\u003c/div>\n    \u003clabel class=\"tog-pill\">\u003cinput type=\"checkbox\" id=\"chkCurve\" checked>\u003cspan data-i18n=\"tog_curve\">显示正态曲线\u003c/span>\u003c/label>\n    \u003clabel class=\"tog-pill\">\u003cinput type=\"checkbox\" id=\"chkMean\" checked>\u003cspan data-i18n=\"tog_mean\">显示模拟均值\u003c/span>\u003c/label>\n  \u003c/div>\n\n  \u003cdiv class=\"stats\">\n    \u003cdiv class=\"stat\">\u003cdiv class=\"k\" data-i18n=\"st_cnt\">抽样对数\u003c/div>\u003cdiv class=\"v\" id=\"stCount\">0\u003c/div>\u003cdiv class=\"s\" data-i18n=\"st_cnt_s\">pairs drawn\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat highlight\">\u003cdiv class=\"k\" data-i18n=\"st_mean\">模拟均值\u003c/div>\u003cdiv class=\"v\" id=\"stMean\">—\u003c/div>\u003cdiv class=\"s\" id=\"stMeanSub\">theory: 5.00\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat highlight\">\u003cdiv class=\"k\" data-i18n=\"st_sd\">模拟标准差 SD\u003c/div>\u003cdiv class=\"v\" id=\"stSD\">—\u003c/div>\u003cdiv class=\"s\" id=\"stSDSub\">theory: 2.85\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cdiv class=\"k\" data-i18n=\"st_last\">最近一次差值\u003c/div>\u003cdiv class=\"v\" id=\"stLast\">—\u003c/div>\u003cdiv class=\"s\" id=\"stLastSub\">—\u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"main-grid\">\n    \u003cdiv>\n      \u003csection class=\"card\">\n        \u003cdiv class=\"chart-head\">\n          \u003ch2 id=\"chartH\" data-i18n=\"chart_title\">x̄₁ − x̄₂ 抽样分布直方图\u003c/h2>\n          \u003cdiv class=\"legend\">\n            \u003cspan>\u003ci class=\"swatch\" style=\"background:var(--navy)\">\u003c/i>\u003cspan data-i18n=\"leg_bar\">模拟差值\u003c/span>\u003c/span>\n            \u003cspan>\u003ci class=\"swatch\" style=\"background:var(--accent)\">\u003c/i>\u003cspan data-i18n=\"leg_tail\">尾部高亮\u003c/span>\u003c/span>\n            \u003cspan>\u003ci class=\"swatch-line\">\u003c/i>\u003cspan data-i18n=\"leg_curve\">正态曲线\u003c/span>\u003c/span>\n            \u003cspan>\u003ci class=\"swatch-dash\">\u003c/i>\u003cspan data-i18n=\"leg_mean\">模拟均值\u003c/span>\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003ccanvas id=\"diffChart\" width=\"680\" height=\"330\">\u003c/canvas>\n        \u003cdiv class=\"empty-note\" id=\"emptyNote\">\u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"card prob-card\">\n        \u003cdiv class=\"prob-controls\">\n          \u003ch2 style=\"margin:0\" data-i18n=\"prob_title\">概率探索器与尾部高亮\u003c/h2>\n          \u003cdiv class=\"prob-input-wrap\">\n            \u003clabel for=\"cutoff\" data-i18n=\"prob_cut\">临界值 c\u003c/label>\n            \u003cinput type=\"number\" class=\"num-input\" id=\"cutoff\" step=\"0.5\" value=\"0\">\n          \u003c/div>\n          \u003cdiv class=\"seg\" role=\"group\" aria-label=\"尾部高亮模式\">\n            \u003cbutton type=\"button\" data-tail=\"none\" aria-pressed=\"true\" data-i18n=\"tail_none\">无高亮\u003c/button>\n            \u003cbutton type=\"button\" data-tail=\"gt\" aria-pressed=\"false\">&gt; c\u003c/button>\n            \u003cbutton type=\"button\" data-tail=\"lt\" aria-pressed=\"false\">&lt; c\u003c/button>\n            \u003cbutton type=\"button\" data-tail=\"two\" aria-pressed=\"false\" data-i18n=\"tail_two\">双尾\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"prob-grid\">\n          \u003cdiv class=\"pbox\">\u003cdiv class=\"pk\" id=\"pEmpLbl\">P(diff &gt; 0.0)\u003c/div>\u003cdiv class=\"pv\" id=\"pEmpVal\">—\u003c/div>\u003cdiv class=\"ps\" id=\"pEmpSub\">—\u003c/div>\u003c/div>\n          \u003cdiv class=\"pbox\">\u003cdiv class=\"pk\" data-i18n=\"prob_model\">理论正态近似\u003c/div>\u003cdiv class=\"pv\" id=\"pTheoVal\">—\u003c/div>\u003cdiv class=\"ps\" id=\"pTheoSub\">—\u003c/div>\u003c/div>\n          \u003cdiv class=\"pbox\">\u003cdiv class=\"pk\" data-i18n=\"prob_z\">标准化 z-score\u003c/div>\u003cdiv class=\"pv\" id=\"pZVal\">—\u003c/div>\u003cdiv class=\"ps\">z = (c − (μ₁−μ₂)) / SE\u003c/div>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"prob-warn\" id=\"probWarn\" hidden data-i18n=\"prob_warn\">⚠ 存在非正态总体且对应样本量 n &lt; 30，理论正态模型仅作参考。\u003c/div>\n      \u003c/section>\n    \u003c/div>\n\n    \u003cdiv class=\"side\">\n      \u003csection class=\"card\">\n        \u003ch2 data-i18n=\"sec_last\">最近一次配对样本\u003c/h2>\n        \u003cdiv id=\"latestEmpty\" style=\"font-size:13.5px;color:var(--ink-2)\">\u003c/div>\n        \u003cdiv id=\"latestBody\" hidden>\n          \u003cdiv class=\"flow\">\n            \u003cdiv class=\"fbox f1\">\u003cdiv class=\"fl\">x̄₁\u003c/div>\u003cdiv class=\"fv\" id=\"lastX1\">—\u003c/div>\u003cdiv class=\"fs\" id=\"lastX1Sub\">\u003c/div>\u003c/div>\n            \u003cdiv style=\"font-weight:800;color:var(--ink-3)\">−\u003c/div>\n            \u003cdiv class=\"fbox f2\">\u003cdiv class=\"fl\">x̄₂\u003c/div>\u003cdiv class=\"fv\" id=\"lastX2\">—\u003c/div>\u003cdiv class=\"fs\" id=\"lastX2Sub\">\u003c/div>\u003c/div>\n            \u003cdiv style=\"font-weight:800;color:var(--ink-3)\">=\u003c/div>\n            \u003cdiv class=\"fbox fd\">\u003cdiv class=\"fl\">diff\u003c/div>\u003cdiv class=\"fv\" id=\"lastDiff\">—\u003c/div>\u003cdiv class=\"fs\" id=\"lastDiffSub\">\u003c/div>\u003c/div>\n          \u003c/div>\n          \u003cdiv style=\"font-size:12px;color:var(--ink-3);margin-top:10px\" data-i18n=\"rec_lbl\">最近 12 次差值：\u003c/div>\n          \u003cdiv class=\"recent\" id=\"recentChips\">\u003c/div>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"card\">\n        \u003ch2 data-i18n=\"sec_check\">理论 vs 模拟检验（含单组 SD）\u003c/h2>\n        \u003ctable class=\"check-tbl\">\n          \u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth data-i18n=\"tbl_th\">理论值\u003c/th>\u003cth data-i18n=\"tbl_sim\">模拟值\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd data-i18n=\"row_mean\">差值均值 μ₁ − μ₂\u003c/td>\u003ctd class=\"mono\" id=\"tMean\">—\u003c/td>\u003ctd class=\"mono\" id=\"sMean\">—\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd data-i18n=\"row_sd\">差值 SD (SE)\u003c/td>\u003ctd class=\"mono\" id=\"tSE\">—\u003c/td>\u003ctd class=\"mono\" id=\"sSE\">—\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd data-i18n=\"row_sd1\">单组 x̄₁ 的 SD\u003c/td>\u003ctd class=\"mono\" id=\"tSE1\">—\u003c/td>\u003ctd class=\"mono\" id=\"sSE1\">—\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd data-i18n=\"row_sd2\">单组 x̄₂ 的 SD\u003c/td>\u003ctd class=\"mono\" id=\"tSE2\">—\u003c/td>\u003ctd class=\"mono\" id=\"sSE2\">—\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>±1·SE\u003c/td>\u003ctd class=\"mono\">≈ 68%\u003c/td>\u003ctd class=\"mono\" id=\"s68\">—\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>±2·SE\u003c/td>\u003ctd class=\"mono\">≈ 95%\u003c/td>\u003ctd class=\"mono\" id=\"s95\">—\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n        \u003cp class=\"var-note\" data-i18n-html=\"var_note\">\u003cb>为什么差值的方差是“相加”？\u003c/b>\u003cbr>两组样本互相独立，随机变量相减不会抵消波动，方差必须相加：Var(x̄₁−x̄₂) = σ₁²/n₁ + σ₂²/n₂，可直接对比上表中的单组 SD 与差值 SD。\u003c/p>\n      \u003c/section>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"presets-grid\">\n    \u003cdiv class=\"preset-card\">\n      \u003cstrong data-i18n=\"pr1_t\">1 · 样本量增大缩小 SE\u003c/strong>\n      \u003cp data-i18n=\"pr1_b\">保持总体不变，把 n₁=n₂ 设到 50 并抽 1,000 对，观察中心不变而分布变窄。\u003c/p>\n      \u003cbutton type=\"button\" data-preset=\"bigN\" data-i18n=\"pr1_btn\">n₁ = n₂ = 50 抽 1,000\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"preset-card\">\n      \u003cstrong data-i18n=\"pr2_t\">2 · 双偏态 + 小样本\u003c/strong>\n      \u003cp data-i18n=\"pr2_b\">两组均选右偏、n₁=n₂=5，抽 1,000 对：小样本下偏斜会残留到差值里。\u003c/p>\n      \u003cbutton type=\"button\" data-preset=\"skewSmall\" data-i18n=\"pr2_btn\">右偏 (5, 5) 抽 1,000\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"preset-card\">\n      \u003cstrong data-i18n=\"pr3_t\">3 · 一大一小对照 (5, 50)\u003c/strong>\n      \u003cp data-i18n=\"pr3_b\">两组均右偏，n₁=5、n₂=50：只要有一组未达 30，仍受小样本组偏态拖累。\u003c/p>\n      \u003cbutton type=\"button\" data-preset=\"skewMixed\" data-i18n=\"pr3_btn\">右偏 (5, 50) 抽 1,000\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"preset-card\">\n      \u003cstrong data-i18n=\"pr4_t\">4 · 双大样本 CLT 生效\u003c/strong>\n      \u003cp data-i18n=\"pr4_b\">两组均右偏、n₁=n₂=50，抽 1,000 对：即使总体极度右偏，差值仍呈钟形对称。\u003c/p>\n      \u003cbutton type=\"button\" data-preset=\"skewBig\" data-i18n=\"pr4_btn\">右偏 (50, 50) 抽 1,000\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cfooter>\n    \u003cspan data-i18n=\"foot\">修改任一总体参数会自动清空模拟；按\u003c/span> \u003cspan class=\"kbd\">Space\u003c/span> \u003cspan data-i18n=\"foot2\">快速抽 1 对样本。\u003c/span>\n  \u003c/footer>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  \"use strict\";\n  var $ = function(id){ return document.getElementById(id); };\n  var state = { reps:[], popCache:{1:[],2:[]}, tail:\"none\", lang:\"zh\" };\n\n  var I18N = {\n    zh:{\n      nav_p:\"样本比例 p̂\", nav_pd:\"两样本比例差 p̂₁ − p̂₂\", nav_m:\"样本均值 x̄\", nav_md:\"两样本均值差 x̄₁ − x̄₂\",\n      h1:\"两样本均值之差的抽样分布 \u003cem>x̄₁ − x̄₂\u003c/em>\",\n      sub:\"设定两个独立总体的分布形状、均值、标准差与样本量，每次抽取一对样本计算 \u003cb>x̄₁ − x̄₂\u003c/b>，对比中心、方差相加规律与 CLT 成立条件。\",\n      f_mean:\"中心\", f_sd:\"标准误 (SE)\", f_cond:\"正态条件\", f_cond_v:\"每组各自满足：总体正态 或 n ≥ 30\",\n      guide_title:\"课堂练习引导（Worksheet Guide）\",\n      guide_body:\"第 4 页：先设置两组正态总体的 μ、σ 和 n，再抽 1,000 对。比较偏态时将两组都切至「右偏」，用下方一键预设快速比较 (n₁=5, n₂=50) 与 (n₁=50, n₂=50) 的形状差异。\",\n      pop1_t:\"总体 1 · Population 1\", pop2_t:\"总体 2 · Population 2\", lbl_dist:\"总体形状\", lbl_dist2:\"总体形状\",\n      opt_norm:\"正态 Normal — 钟形对称\", opt_unif:\"均匀 Uniform — 平坦对称\", opt_right:\"右偏 Right-skewed — 长尾在右\", opt_left:\"左偏 Left-skewed — 长尾在左\", opt_bi:\"双峰 Bimodal — 两个峰\",\n      tog_shared:\"同步两总体横轴刻度（直观对比中心偏移）\",\n      btn_1:\"抽 1 对样本\", btn_reset:\"Reset 清空\", btn_csv:\"导出 CSV\", tog_curve:\"显示正态曲线\", tog_mean:\"显示模拟均值\",\n      st_cnt:\"抽样对数\", st_cnt_s:\"对重复样本\", st_mean:\"模拟均值\", st_sd:\"模拟标准差 SD\", st_last:\"最近一次差值\",\n      chart_title:\"x̄₁ − x̄₂ 抽样分布直方图\", leg_bar:\"模拟差值\", leg_tail:\"尾部高亮\", leg_curve:\"正态曲线\", leg_mean:\"模拟均值\",\n      prob_title:\"概率探索器与尾部高亮\", prob_cut:\"临界值 c\", tail_none:\"无高亮\", tail_two:\"双尾\",\n      prob_model:\"理论正态近似\", prob_z:\"标准化 z-score\",\n      prob_warn:\"⚠ 存在非正态总体且对应样本量 n \u003c 30，理论正态模型仅作参考。\",\n      sec_last:\"最近一次配对样本\", rec_lbl:\"最近 12 次差值：\",\n      sec_check:\"理论 vs 模拟检验（含单组 SD）\", tbl_th:\"理论值\", tbl_sim:\"模拟值\",\n      row_mean:\"差值均值 μ₁ − μ₂\", row_sd:\"差值 SD (SE)\", row_sd1:\"单组 x̄₁ 的 SD\", row_sd2:\"单组 x̄₂ 的 SD\",\n      var_note:\"\u003cb>为什么差值的方差是“相加”？\u003c/b>\u003cbr>两组样本互相独立，随机变量相减不会抵消波动，方差必须相加：Var(x̄₁−x̄₂) = σ₁²/n₁ + σ₂²/n₂，可直接对比上表中的单组 SD 与差值 SD。\",\n      pr1_t:\"1 · 样本量增大缩小 SE\", pr1_b:\"保持总体不变，把 n₁=n₂ 设到 50 并抽 1,000 对，观察中心不变而分布变窄。\", pr1_btn:\"n₁ = n₂ = 50 抽 1,000\",\n      pr2_t:\"2 · 双偏态 + 小样本\", pr2_b:\"两组均选右偏、n₁=n₂=5，抽 1,000 对：小样本下偏斜会残留到差值里。\", pr2_btn:\"右偏 (5, 5) 抽 1,000\",\n      pr3_t:\"3 · 一大一小对照 (5, 50)\", pr3_b:\"两组均右偏，n₁=5、n₂=50：只要有一组未达 30，仍受小样本组偏态拖累。\", pr3_btn:\"右偏 (5, 50) 抽 1,000\",\n      pr4_t:\"4 · 双大样本 CLT 生效\", pr4_b:\"两组均右偏、n₁=n₂=50，抽 1,000 对：即使总体极度右偏，差值仍呈钟形对称。\", pr4_btn:\"右偏 (50, 50) 抽 1,000\",\n      foot:\"修改任一总体参数会自动清空模拟；按\", foot2:\"快速抽 1 对样本。\",\n      empty:\"尚未抽样 — 点击「抽 1 对样本」或「+ 1,000」观察分布形态。\",\n      last_empty:\"尚未抽样。抽取后这里会拆解展示 x̄₁、x̄₂ 与它们的差值。\",\n      cond_both_norm:\"✓ \u003cb>两组总体均为正态\u003c/b>：对任意 n₁、n₂，x̄₁ − x̄₂ 都严格服从正态分布。\",\n      cond_clt_ok:\"✓ \u003cb>满足各自的正态条件\u003c/b>（各组均满足「正态 或 n ≥ 30」）：由 CLT 可知 x̄₁ − x̄₂ 近似正态。\",\n      cond_fail:\"⚠ \u003cb>未满足正态条件\u003c/b>：至少有一组为非正态总体且样本量 n \u003c 30，差值分布可能偏斜。\",\n      theory_pre:\"理论: \"\n    },\n    en:{\n      nav_p:\"Sample Proportion p̂\", nav_pd:\"Diff of Proportions p̂₁ − p̂₂\", nav_m:\"Sample Mean x̄\", nav_md:\"Diff of Means x̄₁ − x̄₂\",\n      h1:\"Sampling Distribution of \u003cem>x̄₁ − x̄₂\u003c/em>\",\n      sub:\"Configure two independent populations and sample sizes. Draw pairs to compute \u003cb>x̄₁ − x̄₂\u003c/b>, verify variance addition, and test CLT conditions.\",\n      f_mean:\"Center\", f_sd:\"Spread (SE)\", f_cond:\"Normal Condition\", f_cond_v:\"Each group: Normal pop OR n ≥ 30\",\n      guide_title:\"Classroom Worksheet Guide\",\n      guide_body:\"Page 4: Set μ, σ, n for two Normal populations and draw 1,000 pairs. Then switch both to Skewed Right and use the preset buttons below to compare (5, 50) vs (50, 50).\",\n      pop1_t:\"Population 1\", pop2_t:\"Population 2\", lbl_dist:\"Population shape\", lbl_dist2:\"Population shape\",\n      opt_norm:\"Normal — Symmetric, bell-shaped\", opt_unif:\"Uniform — Flat, symmetric\", opt_right:\"Skewed right — Long right tail\", opt_left:\"Skewed left — Long left tail\", opt_bi:\"Bimodal — Two peaks\",\n      tog_shared:\"Shared X-axis scale (compare centers visually)\",\n      btn_1:\"Draw 1 pair\", btn_reset:\"Reset\", btn_csv:\"Download CSV\", tog_curve:\"Show Normal curve\", tog_mean:\"Show simulated mean\",\n      st_cnt:\"Pairs drawn\", st_cnt_s:\"replications\", st_mean:\"Simulated mean\", st_sd:\"Simulated SD\", st_last:\"Last difference\",\n      chart_title:\"Sampling Distribution of x̄₁ − x̄₂\", leg_bar:\"Simulated diffs\", leg_tail:\"Shaded tail\", leg_curve:\"Normal curve\", leg_mean:\"Simulated mean\",\n      prob_title:\"Probability Explorer & Tail Shading\", prob_cut:\"Cutoff c\", tail_none:\"None\", tail_two:\"Two-tail\",\n      prob_model:\"Normal Model\", prob_z:\"z-score\",\n      prob_warn:\"⚠ At least one group is non-Normal with n \u003c 30; the Normal model is only approximate.\",\n      sec_last:\"Most Recent Pair\", rec_lbl:\"Last 12 differences:\",\n      sec_check:\"Theory vs. Simulation (with single-sample SDs)\", tbl_th:\"Theory\", tbl_sim:\"Simulated\",\n      row_mean:\"Mean of x̄₁ − x̄₂\", row_sd:\"SD of x̄₁ − x̄₂ (SE)\", row_sd1:\"SD of x̄₁ alone\", row_sd2:\"SD of x̄₂ alone\",\n      var_note:\"\u003cb>Why variances add:\u003c/b>\u003cbr>Because the two samples are independent, Var(x̄₁−x̄₂) = σ₁²/n₁ + σ₂²/n₂. Compare the single-sample SDs above with the difference SD.\",\n      pr1_t:\"1 · Shrink SE with larger n\", pr1_b:\"Keep populations fixed, set n₁=n₂=50, and draw 1,000 pairs.\", pr1_btn:\"Set n₁=n₂=50 & Draw 1,000\",\n      pr2_t:\"2 · Both skewed + small n\", pr2_b:\"Both right-skewed with n₁=n₂=5: skew survives into the difference.\", pr2_btn:\"Skewed (5, 5) & Draw 1,000\",\n      pr3_t:\"3 · Mixed (5, 50) comparison\", pr3_b:\"Both right-skewed with n₁=5, n₂=50: one small sample still pulls shape off Normal.\", pr3_btn:\"Skewed (5, 50) & Draw 1,000\",\n      pr4_t:\"4 · Both large (50, 50) CLT\", pr4_b:\"Both right-skewed with n₁=n₂=50: CLT makes the difference bell-shaped.\", pr4_btn:\"Skewed (50, 50) & Draw 1,000\",\n      foot:\"Changing any setting clears the simulation; press\", foot2:\"to draw 1 pair.\",\n      empty:\"No sample pairs yet — click Draw 1 pair or + 1,000 to begin.\",\n      last_empty:\"No pairs yet. Each draw breaks down x̄₁, x̄₂, and their difference.\",\n      cond_both_norm:\"✓ \u003cb>Both populations are Normal\u003c/b>: x̄₁ − x̄₂ is strictly Normal for any sample sizes.\",\n      cond_clt_ok:\"✓ \u003cb>Normal condition met\u003c/b> (each group is Normal or n ≥ 30): x̄₁ − x̄₂ is approximately Normal by CLT.\",\n      cond_fail:\"⚠ \u003cb>Condition NOT met\u003c/b>: at least one group is non-Normal with n \u003c 30; expect skewness.\",\n      theory_pre:\"theory: \"\n    }\n  };\n\n  function t(k){ return (I18N[state.lang] && I18N[state.lang][k]) || I18N.zh[k] || k; }\n  function clamp(v,lo,hi){ return Math.min(hi, Math.max(lo, v)); }\n  function fmt(x,d){ return (x===null||x===undefined||isNaN(x)) ? \"—\" : Number(x).toFixed(d===undefined?2:d); }\n  function fmtSigned(x,d){ return (x===null||x===undefined||isNaN(x)) ? \"—\" : (x>0?\"+\":\"\")+Number(x).toFixed(d===undefined?2:d); }\n  function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }\n  function arrMinMax(arr){\n    if(!arr.length) return [0,0];\n    var mn=arr[0], mx=arr[0];\n    for(var i=1;i\u003carr.length;i++){ if(arr[i]\u003cmn) mn=arr[i]; if(arr[i]>mx) mx=arr[i]; }\n    return [mn,mx];\n  }\n  function normalPDF(x,mu,sd){ var z=(x-mu)/sd; return Math.exp(-0.5*z*z)/(sd*Math.sqrt(2*Math.PI)); }\n  function normalCDF(z){\n    var a=Math.abs(z), p=1/(1+0.2316419*a);\n    var poly=p*(0.319381530+p*(-0.356563782+p*(1.781477937+p*(-1.821255978+p*1.330274429))));\n    var c=1-Math.exp(-0.5*a*a)/Math.sqrt(2*Math.PI)*poly;\n    return z>=0 ? c : 1-c;\n  }\n  function meanOf(a){ if(!a.length) return NaN; var s=0; for(var i=0;i\u003ca.length;i++) s+=a[i]; return s/a.length; }\n  function sdOf(a){ if(a.length\u003c2) return NaN; var m=meanOf(a), s=0; for(var i=0;i\u003ca.length;i++) s+=(a[i]-m)*(a[i]-m); return Math.sqrt(s/(a.length-1)); }\n  function randn(){ var u=0,v=0; while(u===0) u=Math.random(); while(v===0) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }\n\n  function drawOne(pop){\n    if(pop.dist === \"normal\") return pop.mu + pop.sd * randn();\n    if(pop.dist === \"uniform\") return pop.mu + (Math.random()*2 - 1) * pop.sd * Math.sqrt(3);\n    if(pop.dist === \"right\") return pop.mu + pop.sd * (-Math.log(1 - Math.random()) - 1);\n    if(pop.dist === \"left\") return pop.mu - pop.sd * (-Math.log(1 - Math.random()) - 1);\n    // Exact unit-variance bimodal: E=0, Var = 0.85^2 + (1 - 0.85^2) = 1\n    var shift = Math.random() \u003c 0.5 ? -0.85 : 0.85;\n    return pop.mu + pop.sd * (shift + Math.sqrt(1 - 0.85*0.85) * randn());\n  }\n\n  function getPop(w){\n    var s = w === 1 ? \"1\" : \"2\";\n    return {\n      dist: $(\"dist\"+s).value,\n      mu: clamp(parseFloat($(\"mu\"+s+\"Num\").value) || 0, -200, 200),\n      sd: clamp(parseFloat($(\"sd\"+s+\"Num\").value) || 10, 0.5, 100),\n      n: clamp(Math.round(parseFloat($(\"n\"+s+\"Num\").value) || 30), 2, 500)\n    };\n  }\n  function theory(){\n    var p1 = getPop(1), p2 = getPop(2);\n
